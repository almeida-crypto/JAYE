<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Altar de Hanal Pixán</title>
<link rel="preload" href="../assets/fonts/yeseva-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/portada.css?v=1">
<style>
  :root { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; background: #1b1423; color: #e9d8c4; font: 16px/1.45 system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px;
         padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
  /* Ajustes al chrome de portada.css para convivir con el lienzo del juego */
  body::before { display: none; }          /* sin estrellas detrás del canvas */
  .franja-bordado { height: 30px; flex: none; }
  .barra { width: 100%; max-width: 760px; margin: 0 auto; padding: 6px 12px 0; }
  .cabeza-juego { width: 100%; max-width: 760px; padding: 0 14px; }
  .cabeza-juego h1 { margin: 0; font-family: var(--titulo); font-weight: 400; font-size: clamp(1.6rem, 6vw, 2.2rem); line-height: 1.05; color: var(--crema); }
  .cabeza-juego details { margin-top: 6px; color: var(--texto-suave); font-size: .92rem; }
  .cabeza-juego summary { cursor: pointer; color: var(--naranja); font-weight: 700; min-height: 32px; display: inline-flex; align-items: center; }
  .cabeza-juego ol { margin: 6px 0 0; padding-left: 1.2em; }
  .cabeza-juego li { margin-bottom: 3px; }
  /* Marco del tablero */
  .tablero { padding: 6px; border-radius: 18px; background: linear-gradient(160deg, #3a2a4a, #241a2e);
             border: 1px solid rgba(255, 255, 255, .12); box-shadow: 0 18px 40px rgba(0, 0, 0, .45); line-height: 0; }
  /* image-rendering: pixelated => escalado "nearest neighbor", sin suavizado de bordes */
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; cursor: grab; background: #241a2e; border-radius: 12px; display: block; }
  #ui { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; max-width: 760px; padding: 0 12px; }
  #info { color: #fff4e6; text-align: center; padding: 10px 14px; min-height: 2.9em; width: 100%;
          background: #241931; border: 1px solid rgba(255, 255, 255, .1); border-radius: 14px; font-size: .95rem; }
  #info:empty { display: none; }
  #controles { display: flex; gap: 12px; width: 100%; justify-content: center; }
  /* botones grandes (≥48 px de alto) y de alto contraste para uso táctil */
  #controles button { flex: 1 1 0; max-width: 220px; min-height: 52px; font: inherit; font-weight: 800; color: #2a1606; background: var(--naranja); border: 0; border-radius: 999px; padding: 0 18px; touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent; box-shadow: 0 6px 16px rgba(0, 0, 0, .3); }
  #controles #btnRotar { background: #2f2340; color: var(--texto); border: 1.5px solid rgba(255, 255, 255, .18); }
  #controles button:disabled { opacity: .4; box-shadow: none; }
  #controles button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  /* "Colocar" solo se muestra en pantallas táctiles; con ratón basta el clic */
  @media (hover: hover) and (pointer: fine) { #btnColocar { display: none; } }
  .gira { display: none; margin: 0; color: var(--texto-suave); font-size: .85rem; text-align: center; }
  @media (orientation: portrait) and (max-width: 700px) { .gira { display: block; } }
  @media (max-width: 480px) { .tablero { padding: 0; border: 0; border-radius: 12px; } }
  /* Celular acostado: todo el alto para el tablero; barra y botones en una columna a la derecha */
  @media (orientation: landscape) and (max-height: 520px) {
    .franja-bordado, .cabeza-juego, .gira { display: none; }
    body { display: grid; grid-template-columns: auto 200px; grid-template-rows: auto 1fr; align-items: center;
           justify-content: center; gap: 6px 12px; padding: 6px 10px; min-height: 100vh; box-sizing: border-box; }
    .tablero { grid-column: 1; grid-row: 1 / span 2; padding: 3px; }
    .barra { grid-column: 2; grid-row: 1; width: 200px; padding: 0; flex-wrap: wrap; gap: 6px; }
    .barra .volver-link { min-height: 36px; font-size: .9rem; }
    #ui { grid-column: 2; grid-row: 2; width: 200px; padding: 0; align-self: start; }
    #controles { flex-direction: column; }
    #controles button { max-width: none; min-height: 48px; }
    #info { font-size: .8rem; padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="franja-bordado" aria-hidden="true"></div>
<div class="barra">
  <a class="volver-link" href="index.html" data-es="← Volver a juegos" data-en="← Back to games"></a>
  <div class="selector-idioma" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
  </div>
</div>
<header class="cabeza-juego">
  <h1 data-es="Arma el altar" data-en="Build the altar"></h1>
  <details>
    <summary data-es="¿Cómo se juega?" data-en="How to play?"></summary>
    <ol>
      <li data-es="Toca una caja para sacar un objeto." data-en="Tap a box to take out an object."></li>
      <li data-es="Muévelo hasta su lugar: el suelo o uno de los tres escalones. Las celdas verdes dicen que cabe." data-en="Move it to its place: the floor or one of the three steps. Green cells mean it fits."></li>
      <li data-es="En el celular confirma con «Colocar»; en la computadora, con un clic. «Girar» lo voltea 90°." data-en="On a phone confirm with «Place»; on a computer, just click. «Rotate» turns it 90°."></li>
      <li data-es="Cuando vacíes las cajas, el juego revisa tu altar y le toma una foto." data-en="When the boxes are empty, the game checks your altar and takes a photo of it."></li>
    </ol>
  </details>
</header>
<div class="tablero"><canvas id="juego"></canvas></div>
<div id="ui">
  <div id="info"></div>
  <div id="controles">
    <button id="btnRotar" type="button" aria-label="Girar el objeto 90 grados">↻ Girar</button>
    <button id="btnColocar" type="button">Colocar</button>
  </div>
  <p class="gira" data-es="Consejo: gira tu celular para ver el altar más grande." data-en="Tip: turn your phone sideways to see the altar bigger."></p>
</div>
<script>
'use strict';

/* ============================================================
 * 0. IDIOMA — se lee igual que en el resto del sitio (?lang, localStorage 'jaye-idioma')
 * ============================================================ */
const LANG = (function () {
  var q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'es') return q;
  try { var l = localStorage.getItem('jaye-idioma'); if (l === 'en' || l === 'es') return l; } catch (e) {}
  return 'es';
})();
// Nombres de los objetos en inglés (en español van en el CATALOGO)
const NOMBRES_EN = {
  foto: 'Deceased photograph', rosario: 'Rosary', cruz: 'Green cross',
  espejo: 'Personal item of the deceased', vela: 'Candle', cerveza: 'Personal item of the deceased',
  cigarros: 'Personal item of the deceased', petalos: 'Petal path', ceniza: 'Lime cross',
  copal: 'Incense burner (copal)', veladoras: 'Votive candles in a cross',
  comida: 'Tamales', bebida: 'Atole', escabeche: 'Escabeche', dulce: 'Coconut sweet', dulce2: 'Coconut sweet',
  mandarina: 'Mandarin', jicama: 'Jícama', sal: 'Salt', agua: 'Glass of pure water'
};
// Textos de interfaz por idioma
const TEXTOS = {
  es: { iniciar: 'Empezar a jugar', girar: '↻ Girar', colocar: 'Colocar', ariaGirar: 'Girar el objeto 90 grados' },
  en: { iniciar: 'Start playing', girar: '↻ Rotate', colocar: 'Place', ariaGirar: 'Rotate the object 90 degrees' }
};

/* ============================================================
 * 1. CONFIG — constantes globales (único lugar a tocar para ajustes)
 * ============================================================ */
const CFG = {
  ANCHO: 352, ALTO: 224,     // resolución INTERNA (baja = pixel art real); el CSS la escala
  TW: 32, TH: 16,            // tamaño en píxeles de una loseta isométrica (relación 2:1)
  UZ: 16,                    // píxeles que equivale 1 unidad de altura (eje Z)
  ORIGEN: { x: 176, y: 56 }, // punto de pantalla donde cae la esquina (0,0) del mundo
  MAPA: 10                   // el suelo es una rejilla MAPA x MAPA
};

/* ============================================================
 * 2. ISO — matemática isométrica (mundo <-> pantalla)
 *    Mundo: x crece hacia abajo-derecha, y hacia abajo-izquierda, z hacia arriba.
 * ============================================================ */
const Iso = {
  // Mundo (x,y,z) -> pantalla (sx,sy). Se redondea a entero para evitar píxeles "a medias".
  aPantalla(x, y, z = 0) {
    return {
      sx: Math.round((x - y) * CFG.TW / 2 + CFG.ORIGEN.x),
      sy: Math.round((x + y) * CFG.TH / 2 - z * CFG.UZ + CFG.ORIGEN.y)
    };
  },
  // Inversa: pantalla -> mundo, asumiendo que el punto está sobre el plano horizontal "z".
  // Despejando el sistema: x = dx/TW + dy/TH ; y = dy/TH - dx/TW
  aMundo(sx, sy, z = 0) {
    const dx = sx - CFG.ORIGEN.x;
    const dy = sy - CFG.ORIGEN.y + z * CFG.UZ; // compensamos la altura del plano
    return { x: dx / CFG.TW + dy / CFG.TH, y: dy / CFG.TH - dx / CFG.TW };
  }
};

/* ============================================================
 * 3. ENTIDAD — caja isométrica con huella (w,d) y altura (h) en unidades de mundo
 *    Más adelante: aquí se sustituye el dibujo procedural por un sprite.
 * ============================================================ */
class Entidad {
  constructor({ x, y, z = 0, w = 1, d = 1, h = 1, color, movible = false, margen = 0 }) {
    // x,y,w,d = huella en CELDAS enteras; margen = encogimiento visual dentro de la huella
    Object.assign(this, { x, y, z, w, d, h, color, movible, margen });
  }
  // Dibuja un prisma con 3 caras (techo, frontal-izq, frontal-der) con sombreado plano.
  dibujar(ctx) {
    // Si la entidad tiene una textura pre-renderizada (p. ej. el mantel del altar), se dibuja tal cual
    if (this.sprite) { ctx.drawImage(this.sprite.img, this.sprite.ox, this.sprite.oy); return; }
    // El margen encoge solo el DIBUJO; la lógica y el orden de profundidad usan la huella completa
    const m = this.margen, { z, h } = this;
    const x = this.x + m, y = this.y + m, w = this.w - 2 * m, d = this.d - 2 * m, zt = z + h; // zt = altura del techo
    const P = (px, py, pz) => Iso.aPantalla(px, py, pz);
    const cara = (pts, col) => {            // rellena un polígono con color sólido
      ctx.fillStyle = col; ctx.beginPath();
      pts.forEach((p, i) => i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy));
      ctx.closePath(); ctx.fill();
    };
    // Si el objeto tiene sprite pixel art, se dibuja en lugar del prisma (el contorno de comprobación se conserva)
    if (Sprites.tiene(this)) Sprites.dibujar(ctx, this);
    else {
      // Cara frontal izquierda (lado y+d): tono medio
      cara([P(x, y + d, zt), P(x + w, y + d, zt), P(x + w, y + d, z), P(x, y + d, z)], sombra(this.color, .75));
      // Cara frontal derecha (lado x+w): tono oscuro
      cara([P(x + w, y, zt), P(x + w, y + d, zt), P(x + w, y + d, z), P(x + w, y, z)], sombra(this.color, .55));
      // Techo: tono claro (color base)
      cara([P(x, y, zt), P(x + w, y, zt), P(x + w, y + d, zt), P(x, y + d, zt)], this.color);
    }
    // Contorno de comprobación: rojo parpadeante si está mal ubicado; verde breve si acaba de acertar
    const col = this.error ? (Math.floor(Juego.reloj * 4) % 2 ? '#ff2d2d' : '#8a1212') : (this.destello > 0 ? '#3ddc6a' : null);
    if (col) {
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath();
      // Silueta hexagonal de la caja isométrica
      [P(x, y, zt), P(x + w, y, zt), P(x + w, y, z), P(x + w, y + d, z), P(x, y + d, z), P(x, y + d, zt)]
        .forEach((p, i) => i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy));
      ctx.closePath(); ctx.stroke();
    }
  }
}
// Oscurece un color "#rrggbb" multiplicando sus canales por f (0..1)
function sombra(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(v * f));
  return `rgb(${c})`;
}

/* ============================================================
 * 4. ORDEN DE PROFUNDIDAD — ordenamiento topológico para cajas isométricas.
 *    Ordenar por (x+y) falla con objetos de distinto tamaño/altura (p. ej. un
 *    objeto sobre un nivel del altar). Aquí comparamos pares de cajas:
 *    "a está detrás de b" si a queda completamente antes que b en algún eje.
 *    La cámara mira desde +x, +y, y +z (arriba).
 * ============================================================ */
const detras = (a, b) =>
  a.x + a.w <= b.x + 1e-6 || a.y + a.d <= b.y + 1e-6 || a.z + a.h <= b.z + 1e-6;

function ordenarProfundidad(lista) {
  const res = [], visto = new Set();
  const visitar = (e) => {
    if (visto.has(e)) return;
    visto.add(e);                              // marcar ANTES de recursar evita ciclos infinitos
    for (const o of lista)                     // primero se dibuja todo lo que queda detrás de "e"
      if (o !== e && detras(o, e) && !detras(e, o)) visitar(o);
    res.push(e);
  };
  lista.forEach(visitar);
  return res;                                   // orden final: del fondo al frente
}

/* ============================================================
 * 5. ESCENA — contiene el mundo (suelo, altar, objetos) y su lógica
 * ============================================================ */
const Escena = {
  entidades: [],
  hover: null, agarrable: null,        // loseta bajo el cursor

  iniciar() {
    this.entidades = []; Recipientes.lista = []; Mano.item = null; // reinicio limpio para cada año
    // Altar de 3 escalones (placeholder); fondo = más alto. Huellas sin solaparse.
    this.entidades.push(
      // El altar queda pegado a la pared del fondo (y = 0): un escalón más atrás que antes
      new Entidad({ x: 0, y: 0, w: 8, d: 1, h: 1.5, color: '#7a4a8c' }),
      new Entidad({ x: 0, y: 1, w: 8, d: 1, h: 1.0, color: '#9c5fae' }),
      new Entidad({ x: 0, y: 2, w: 8, d: 1, h: 0.5, color: '#b97fc9' }),
      // Paredes decorativas (fuera de la rejilla, y < 0 / x < 0): no ocupan ninguna celda
      new Entidad({ x: -0.5, y: -0.5, w: 10.5, d: 0.5, h: 2.5, color: '#5a4270' }), // pared del fondo
      new Entidad({ x: -0.5, y: 0, w: 0.5, d: 10, h: 2.5, color: '#4d3a62' })       // pared lateral
    );
    // Hojas de plátano que cubren los 3 niveles del altar, como en Yucatán (son las 3 primeras entidades)
    Mantel.aplicar(this.entidades.slice(0, 3));
    Pared.aplicar(this.entidades.slice(3, 5));   // paredes de albarrada (piedra seca)
    // FASE 2: se crean los 4 recipientes cerrados (2 cajas, olla, cesto) con su contenido
    Recipientes.crearTodos(this.entidades);
  },

  // Mouse picking: de arriba a abajo (inverso al dibujo) busca la entidad bajo el cursor.
  // Se prueba el punto proyectado sobre el techo de la caja, convertido a mundo.
  recoger(sx, sy) {
    const orden = ordenarProfundidad(this.entidades).reverse();
    for (const e of orden) {
      if (!e.movible) continue;
      if (Sprites.tiene(e)) { if (Sprites.golpe(e, sx, sy)) return { e }; continue; }   // con sprite: solo cuenta un píxel visible de su dibujo
      const m = Iso.aMundo(sx, sy, e.z + e.h);        // plano del techo
      if (m.x >= e.x && m.x <= e.x + e.w && m.y >= e.y && m.y <= e.y + e.d)
        return { e, ox: m.x - e.x, oy: m.y - e.y };
    }
    return null;
  },

};

/* ============================================================
 * 5b. FASE 2 — CATÁLOGO, RECIPIENTES Y ÁREA DE ESPERA
 * ============================================================ */

// Catálogo de ítems agrupado por CATEGORÍA.
// cant = cuántas copias de ese ítem se meten en el recipiente.
// h = altura en unidades de mundo; la huella en celdas va en TAM_CELDAS. Colores y tamaños son marcadores de posición.
const CATALOGO = {
  // Cajas (2): todo lo que no es comida. Sus piezas se reparten al azar entre las dos cajas.
  objeto: [
    // Nivel 1 (escalón más alto)
    { id: 'foto',      nombre: 'Fotografía de difunto', color: '#8fb3c9', h: .8,  cant: 2 },
    { id: 'rosario',   nombre: 'Rosario',               color: '#6b4a3a', h: .2,  cant: 1 },
    { id: 'cruz',      nombre: 'Cruz verde',            color: '#3fbf8f', h: 1.75, cant: 1 },   // 28 px de alto
    // Nivel 2 (escalón de en medio)
    { id: 'espejo',    nombre: 'Objeto personal del difunto',                color: '#aee1ee', h: .8,  cant: 1 },
    { id: 'vela',      nombre: 'Vela o veladora',       color: '#f7f3e3', h: .9,  cant: 2 },
    { id: 'cerveza',   nombre: 'Objeto personal del difunto',               color: '#e8a21c', h: .8,  cant: 1 },
    // Nivel 2 (cigarros: antes en el escalón base, ahora en el de en medio)
    { id: 'cigarros',  nombre: 'Objeto personal del difunto', color: '#a58b6e', h: .3, cant: 1 },
    // Suelo
    { id: 'petalos',   nombre: 'Camino de pétalos',    color: '#ffb627', h: .1,  cant: 2 },
    { id: 'ceniza',    nombre: 'Cruz de cal',        color: '#ececec', h: .1,  cant: 1 },
    { id: 'copal',     nombre: 'Incensario (copal)',      color: '#7a6a5a', h: .3,  cant: 2 },
    { id: 'veladoras', nombre: 'Veladoras en cruz',     color: '#f4d58d', h: .5,  cant: 2 }
  ],
  // Olla: comida preparada (tamal, atole, escabeche y dulce)
  comida: [
    { id: 'comida',    nombre: 'Tamales',        color: '#b5651d', h: .4,  cant: 1 },   // Nivel 3
    { id: 'bebida',    nombre: 'Atole',     color: '#5b3a29', h: .7,  cant: 1 },   // Nivel 3
    { id: 'escabeche', nombre: 'Escabeche',             color: '#c9862c', h: .5,  cant: 1 },   // Nivel 3
    { id: 'dulce',     nombre: 'Dulce de coco',     color: '#5c2e16', h: .3,  cant: 1 },   // Nivel 3
  ],
  // Cesto: frutas, sal, segundo dulce y vaso de agua
  fruta: [
    { id: 'mandarina', nombre: 'Mandarina',             color: '#f2a23a', h: .5,  cant: 1 },
    { id: 'jicama',    nombre: 'Jícama',                color: '#d9cfae', h: .5,  cant: 1 },   // Nivel 3
    { id: 'sal',       nombre: 'Sal',                   color: '#f2f2f2', h: .3,  cant: 1 },   // Nivel 2
    { id: 'dulce2',    nombre: 'Dulce de coco',         color: '#8a4a1c', h: .3,  cant: 1 },   // Nivel 2
    { id: 'agua',      nombre: 'Vaso de agua pura',     color: '#cfe8f5', h: .6,  cant: 1 }    // Suelo
  ]
};

// Definición de los 3 tipos de recipiente: qué categorías aceptan, tamaño y colores.
const TIPOS_RECIPIENTE = {
  caja:  { categorias: ['objeto'],         w: 1.4, d: 1.4, h: .9,  color: '#a8783c', tapa: '#c4934f' },
  olla:  { categorias: ['comida'],         w: 1.2, d: 1.2, h: 1.0, color: '#9c4a32', tapa: '#b95a40' },
  cesto: { categorias: ['fruta'],  w: 1.3, d: 1.3, h: .9,  color: '#c9a45c', tapa: '#d8b872' }
};

// Baraja un arreglo en el lugar (Fisher-Yates): garantiza orden verdaderamente aleatorio.
function barajar(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Construye la pila de un recipiente: SOLO ítems de sus categorías, ya barajados.
// Así cada pop() devuelve un ítem aleatorio sin repetir ni volver a sortear.
function crearPila(categorias) {
  const pila = [];
  for (const cat of categorias)
    for (const it of CATALOGO[cat])
      for (let n = 0; n < it.cant; n++) pila.push({ ...it, categoria: cat });
  return barajar(pila);
}

// Convierte una definición del catálogo en una Entidad movible (lista para Drag & Drop).
function crearItem(def) {
  const [cw, cd] = TAM_CELDAS[def.id] || [1, 1];   // huella en celdas (por defecto 1x1)
  const item = new Entidad({ x: 0, y: 0, z: 0, w: cw, d: cd, h: def.h, color: def.color, movible: true, margen: .12 });
  // Metadatos para la validación del puzle (Fase 4); rot = giros de 90° aplicados (0..3)
  return Object.assign(item, { id: def.id, nombre: LANG === 'en' && NOMBRES_EN[def.id] ? NOMBRES_EN[def.id] : def.nombre, categoria: def.categoria, rot: 0 });
}

// Recipiente = Entidad con estado (cerrado/abierto), pila de ítems y animaciones.
class Recipiente extends Entidad {
  constructor(tipo, x, y, pila) {
    const def = TIPOS_RECIPIENTE[tipo];
    super({ x, y, z: 0, w: 2, d: 2, h: def.h, color: def.color, margen: (2 - def.w) / 2 }); // huella fija 2x2 celdas
    this.tipo = tipo; this.def = def;
    this.pila = pila || crearPila(def.categorias); // contenido restante (el final del arreglo = siguiente en salir)
    this.tVacio = 0; this.desv = 0; this.desvaneciendo = false; this.fuera = false; // control de la desaparición al vaciarse
    this.abierto = false;                   // estado visual: false = con tapa, true = destapado
    this.animTapa = 0;                      // 0..1: progreso de la tapa elevándose y desvaneciéndose
    this.rebote = 0;                        // 1..0: pequeño salto del recipiente al sacar un objeto
    // La tapa es una caja delgada que se dibuja encima del cuerpo
    this.tapa = new Entidad({ x: x + this.margen - .06, y: y + this.margen - .06, z: def.h, w: def.w + .12, d: def.d + .12, h: .18, color: def.tapa });
  }

  // Bandera de estado: true cuando ya no quedan objetos dentro
  get estaVacio() { return this.pila.length === 0; }

  // Un clic: el primero destapa; cada clic saca UN ítem aleatorio (pop). Devuelve la Entidad o null.
  extraer() {
    if (this.estaVacio) return null;       // vacío: no hay nada que sacar
    this.abierto = true;                   // cambia de estado visual (cerrado -> abierto)
    this.rebote = 1;                       // dispara la animación de salto
    return crearItem(this.pila.pop());     // pop sobre pila barajada = ítem al azar
  }

  // Caja delimitadora en pantalla (8 esquinas proyectadas) para detectar el clic.
  // Es una aproximación rápida: incluye las caras laterales, algo que el plano del techo no cubre.
  contiene(sx, sy) {
    const xs = [], ys = [];
    for (const dx of [0, this.w]) for (const dy of [0, this.d]) for (const z of [this.z, this.z + this.h]) {
      const p = Iso.aPantalla(this.x + dx, this.y + dy, z); xs.push(p.sx); ys.push(p.sy);
    }
    return sx >= Math.min(...xs) && sx <= Math.max(...xs) && sy >= Math.min(...ys) && sy <= Math.max(...ys);
  }

  // Avanza las animaciones (dt en segundos)
  actualizar(dt) {
    if (this.abierto) this.animTapa = Math.min(1, this.animTapa + dt * 4);
    this.rebote = Math.max(0, this.rebote - dt * 6);
    // Al vaciarse: tras una breve pausa estalla en pétalos y se desvanece; luego se retira del escenario
    if (this.estaVacio && this.abierto && !this.desvaneciendo && (this.tVacio += dt) > .7) {
      this.desvaneciendo = true;
      const c = Iso.aPantalla(this.x + this.w / 2, this.y + this.d / 2, this.h);
      Efectos.petalos(c.sx, c.sy);
    }
    if (this.desvaneciendo) {
      this.desv = Math.min(1, this.desv + dt * 1.5);
      if (this.desv >= 1) this.fuera = true;   // listo para retirarse (lo hace Recipientes.actualizar)
    }
  }

  // Dibujo: cuerpo + interior oscuro (si está abierto) + tapa + contador de objetos restantes
  dibujar(ctx) {
    ctx.save();
    // Salto al extraer + hundimiento y desvanecimiento al desaparecer
    ctx.translate(0, -Math.round(this.rebote * 3) + Math.round(this.desv * 8));
    ctx.globalAlpha = 1 - this.desv;
    if (this.tipo in Sprites.CONT) Sprites.dibujarCont(ctx, this); else super.dibujar(ctx);                               // cuerpo (prisma de la Fase 1)
    const { x, y, w, d } = this, zt = this.z + this.h, ins = this.margen + .14;
    const P = (px, py) => Iso.aPantalla(px, py, zt);
    if (this.abierto && !(this.tipo in Sprites.CONT)) {                               // "agujero" interior: más oscuro mientras tenga objetos
      ctx.fillStyle = this.estaVacio ? '#3a2e44' : '#150f1a';
      ctx.beginPath();
      [P(x + ins, y + ins), P(x + w - ins, y + ins), P(x + w - ins, y + d - ins), P(x + ins, y + d - ins)]
        .forEach((p, i) => i ? ctx.lineTo(p.sx, p.sy) : ctx.moveTo(p.sx, p.sy));
      ctx.closePath(); ctx.fill();
    }
    if (this.animTapa < 1) {                          // la tapa sube y se desvanece al abrir
      this.tapa.z = this.h + this.animTapa * 1.2;
      ctx.globalAlpha = 1 - this.animTapa;
      if (this.tipo in Sprites.CONT) Sprites.dibujarTapaCont(ctx, this); else this.tapa.dibujar(ctx);
      ctx.globalAlpha = 1;
    }
    if (!this.estaVacio) {                            // contador de objetos restantes sobre el recipiente
      const c = Iso.aPantalla(x + w / 2, y + d / 2, zt + 1.3);
      ctx.fillStyle = '#150f1a'; ctx.beginPath(); ctx.arc(c.sx, c.sy, 8, 0, 6.283); ctx.fill();   // insignia oscura para que el número se lea
      ctx.strokeStyle = '#f2a23a'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(this.pila.length, c.sx, c.sy);
    }
    ctx.restore();
  }
}

/* ============================================================
 * FASE 3 — REJILLA (lógica por celdas) Y MANO (objeto sostenido)
 * ============================================================ */

// Huella en celdas (ancho x fondo) de los ítems que NO son 1x1
const TAM_CELDAS = { petalos: [2, 1], ceniza: [2, 3] };   // camino de pétalos 2x1 y cruz de ceniza 2x3 (se pueden girar)

// Rejilla: toda la colocación se resuelve en celdas enteras (i,j); no existen posiciones libres.
const Rejilla = {
  N: CFG.MAPA,

  // Bloque de altar = entidad fija que no es recipiente. Es una SUPERFICIE elevada donde sí se puede colocar.
  esAltar: e => !e.movible && !(e instanceof Recipiente),

  // Altura de la superficie de una celda: techo del bloque de altar que la cubre, o 0 (suelo)
  altura(i, j) {
    let alt = 0;
    for (const e of Escena.entidades)
      if (this.esAltar(e) && i >= e.x && i < e.x + e.w && j >= e.y && j < e.y + e.d) alt = Math.max(alt, e.z + e.h);
    return alt;
  },

  // Celda cuya SUPERFICIE queda bajo el cursor. Se proyecta el cursor al plano de cada celda
  // (a la altura de SU superficie) y gana la más alta, que es la que se ve al frente.
  // (Antes se iteraba desde el suelo y en los niveles altos del altar la proyección saltaba de nivel.)
  celdaBajo(sx, sy) {
    let mejor = null, zMax = -1;
    for (let i = 0; i < this.N; i++)
      for (let j = 0; j < this.N; j++) {
        const z = this.altura(i, j), m = Iso.aMundo(sx, sy, z);
        if (Math.floor(m.x) === i && Math.floor(m.y) === j && z > zMax) { mejor = { i, j }; zMax = z; }
      }
    if (mejor) return mejor;
    const m = Iso.aMundo(sx, sy, 0);   // fuera del mapa: celda virtual sobre el suelo (siempre inválida)
    return { i: Math.floor(m.x), j: Math.floor(m.y) };
  },

  // ¿La celda está ocupada por un recipiente u otro objeto? (se ignora el propio objeto en mano)
  ocupada(i, j, ignorar) {
    return Escena.entidades.some(e => e !== ignorar && !this.esAltar(e) &&
      i >= e.x && i < e.x + e.w && j >= e.y && j < e.y + e.d);
  },

  // Reglas: 1) toda la huella dentro del mapa, 2) superficie plana (misma altura en todas las celdas),
  // 3) ninguna celda ocupada => no hay encimado ni colocación sobre recipientes.
  puedeColocar(it, i0, j0) {
    if (i0 < 0 || j0 < 0 || i0 + it.w > this.N || j0 + it.d > this.N) return false;
    const z0 = this.altura(i0, j0);
    for (let i = i0; i < i0 + it.w; i++)
      for (let j = j0; j < j0 + it.d; j++)
        if (this.altura(i, j) !== z0 || this.ocupada(i, j, it)) return false;
    return true;
  }
};

// Mano: el único objeto que el jugador sostiene. Mientras haya uno, no se puede sacar otro.
const Mano = {
  item: null,
  cursor: { sx: 0, sy: 0 },   // última posición del cursor (para recalcular al girar)
  inicio: null,               // punto donde se pulsó, para detectar arrastrar y soltar

  // Toma un objeto (recién extraído o ya colocado): queda pegado al cursor
  tomar(item) {
    this.item = item; item.enMano = true;
    this.mover(this.cursor.sx, this.cursor.sy);
  },

  // Ajusta el objeto a la celda bajo el cursor y recalcula si la posición es válida
  mover(sx, sy) {
    this.cursor = { sx, sy };
    const it = this.item; if (!it) return;
    const { i, j } = Rejilla.celdaBajo(sx, sy);   // celda cuya superficie (suelo o altar) está bajo el cursor
    // El cursor queda aproximadamente en el centro de la huella
    it.x = i - ((it.w - 1) >> 1); it.y = j - ((it.d - 1) >> 1);
    it.valido = Rejilla.puedeColocar(it, it.x, it.y);
    it.z = Rejilla.altura(it.x, it.y) + .3;       // levita un poco mientras se sostiene
  },

  // Gira 90°: intercambia ancho y fondo de la huella (dir = +1 / -1)
  rotar(dir) {
    const it = this.item; if (!it) return;
    [it.w, it.d] = [it.d, it.w];
    it.rot = (it.rot + dir + 4) % 4;
    this.mover(this.cursor.sx, this.cursor.sy);   // revalida con la nueva huella
  },

  // Intenta soltar el objeto; si no hay celdas libres suficientes, no lo permite
  colocar() {
    const it = this.item;
    if (!it || !it.valido) return false;
    it.z = Rejilla.altura(it.x, it.y);            // se asienta sobre la superficie
    it.enMano = false; this.item = null;
    Comprobacion.alColocar(it);                   // en la fase de corrección, re-evalúa este objeto
    return true;
  },

  // Etiqueta con el nombre del objeto sostenido, sobre su dibujo (se mantiene dentro del lienzo)
  dibujarEtiqueta(ctx) {
    const it = this.item; if (!it) return;
    const s = Sprites.tiene(it) ? Sprites.obtener(it) : null, p = Iso.aPantalla(it.x + it.w / 2, it.y + it.d / 2, it.z);
    ctx.save();
    ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = Math.ceil(ctx.measureText(it.nombre).width) + 10, h = 15;
    const x = Math.round(Math.min(Math.max(p.sx, w / 2 + 2), CFG.ANCHO - w / 2 - 2));            // sin salirse por los lados
    const y = Math.round(Math.max(p.sy - (s ? s.ay : 16) - 12, h / 2 + 2));                       // encima del sprite (y sin salirse por arriba)
    ctx.fillStyle = 'rgba(21,15,26,.94)'; ctx.fillRect(x - w / 2, y - h / 2, w, h);
    ctx.strokeStyle = '#f2a23a'; ctx.lineWidth = 1; ctx.strokeRect(x - w / 2 + .5, y - h / 2 + .5, w - 1, h - 1);
    ctx.fillStyle = '#fff'; ctx.fillText(it.nombre, x, y + 1);
    ctx.restore();
  },

  // Pinta las celdas de la huella: verde = válido, rojo = inválido (se llama tras dibujar entidades)
  dibujarPreview() {
    const it = this.item; if (!it) return;
    const z = Rejilla.altura(it.x, it.y);
    for (let i = it.x; i < it.x + it.w; i++)
      for (let j = it.y; j < it.y + it.d; j++)
        dibujarLoseta(i, j, it.valido ? '#3ddc6a77' : '#ff3b3b88', z);
  }
};

// Módulo que gestiona todos los recipientes e interpreta los clics sobre ellos.
const Recipientes = {
  lista: [],

  // Crea los 3 recipientes en el lado derecho del mapa y los registra en la escena
  crearTodos(entidades) {
    // Las 2 cajas se reparten al azar los objetos: cada pieza va a una sola caja
    const objetos = crearPila(['objeto']), mitad = Math.ceil(objetos.length / 2);
    const plan = [   // [tipo, x, y, pila]: 4 recipientes de 2x2 celdas en la columna derecha
      ['caja', 8, 1, objetos.slice(0, mitad)], ['caja', 8, 3, objetos.slice(mitad)],
      ['olla', 8, 5], ['cesto', 8, 7]
    ];
    for (const [tipo, x, y, pila] of plan) {
      const r = new Recipiente(tipo, x, y, pila);
      this.lista.push(r); entidades.push(r);
    }
  },

  // Estado global: true cuando los 3 recipientes ya se vaciaron Y desaparecieron del escenario
  get todosVacios() { return this.lista.every(r => r.fuera); },

  // Clic en pantalla: busca el recipiente más cercano a cámara bajo el cursor y extrae un objeto.
  clic(sx, sy, entidades) {
    for (const r of ordenarProfundidad(this.lista).reverse()) { // de frente al fondo
      if (r.estaVacio || !r.contiene(sx, sy)) continue; // un recipiente vacío ya no responde al clic
      const item = r.extraer();
      if (item) {                                                // el ítem queda sostenido por el cursor (Mano)
        entidades.push(item); Mano.tomar(item);
      }
      return true;                                               // el clic fue consumido por un recipiente
    }
    return false;
  },

  // Animaciones por fotograma de los recipientes (tapa y rebote)
  actualizar(dt, entidades) {
    this.lista.forEach(r => r.actualizar(dt));
    // Los recipientes ya desvanecidos se retiran del escenario (liberan sus celdas)
    for (const r of this.lista) {
      const k = r.fuera ? entidades.indexOf(r) : -1;
      if (k >= 0) entidades.splice(k, 1);
    }
  }
};

/* ============================================================
 * FASE 4 — VALIDACIÓN, COMPROBACIÓN, FOTO Y ESTADOS DEL JUEGO
 * ============================================================ */

// Reglas lógicas: niveles permitidos por ítem (id del catálogo).
// Cada objeto tiene UN solo nivel asignado: el suelo o uno de los 3 niveles del altar.
// Nombres de nivel según el altar (N1 = escalón más alto). El valor es la altura de la superficie / 0.5.
const SUELO = 0, N3 = 1, N2 = 2, N1 = 3;
const REGLAS = {
  foto: N1, rosario: N1, cruz: N1,                     // Nivel 1
  sal: N2, dulce2: N2, vela: [N2, N1], espejo: N2, cerveza: N2,                    // Nivel 2
  comida: N3, bebida: N3, escabeche: N3, dulce: N3, cigarros: N2, mandarina: N3, jicama: N3,   // Nivel 3
  petalos: SUELO, ceniza: SUELO, copal: SUELO, agua: SUELO, veladoras: SUELO // Suelo
};
// Filas del suelo (hasta la fila indicada, exclusiva) donde vale cada objeto; por defecto las 2 filas frente al altar
const FILA_MAX = { petalos: 10, ceniza: 10 };   // el camino de pétalos y la cruz de ceniza pueden ir en todo el frente

// Validación de un objeto individual
const Validacion = {
  // Nivel de superficie (0..3) donde descansa el objeto: cada nivel del altar sube 0.5 de altura
  nivel: it => Math.round(Rejilla.altura(it.x, it.y) / 0.5),

  esValido(it) {
    const n = this.nivel(it), meta = REGLAS[it.id];
    if (meta !== undefined && ![].concat(meta).includes(n)) return false;   // meta puede ser un nivel o una lista de niveles válidos (p. ej. la vela blanca: N2 o N1)   // el objeto está en un nivel que no le corresponde
    // En el suelo solo vale frente al altar (no "tirado" en cualquier parte)
    if (n === SUELO) return it.y >= 3 && it.y + it.d <= (FILA_MAX[it.id] || 5) && it.x >= 0 && it.x + it.w <= 8;
    return true;
  },

  // Objetos ya colocados (se excluye el que está en la mano)
  colocados: () => Escena.entidades.filter(e => e.movible && !e.enMano)
};

// Modo comprobación: revisa objeto por objeto y gestiona la fase de corrección
const Comprobacion = {
  cola: [], t: 0,

  // Congela la colocación e inicia la revisión secuencial
  iniciar() {
    Juego.cambiar('comprobando');
    this.cola = Validacion.colocados();   // se revisan TODOS los objetos colocados
    this.t = 0;
  },

  actualizar(dt) {
    for (const e of Escena.entidades) if (e.destello > 0) e.destello = Math.max(0, e.destello - dt); // apaga el verde
    if (Juego.estado !== 'comprobando') return;
    this.t -= dt; if (this.t > 0) return;                   // un objeto cada 0.15 s
    const it = this.cola.shift();
    if (it) { it.error = !Validacion.esValido(it); it.destello = it.error ? 0 : .5; this.t = .15; return; }
    // Cola terminada: si hay errores se pasa a corregir; TODOS los objetos siguen siendo movibles (evita softlocks)
    this.hayErrores() ? Juego.cambiar('corrigiendo') : Juego.resolver();
  },

  hayErrores: () => Validacion.colocados().some(e => e.error),

  // Fase de corrección: al soltar un objeto se re-evalúa solo ese; si ya no quedan errores, se resuelve
  alColocar(it) {
    if (Juego.estado !== 'corrigiendo') return;
    it.error = !Validacion.esValido(it);
    if (!it.error) it.destello = .5;   // un objeto correcto que se reubicó bien destella en verde
    if (!this.hayErrores()) Juego.resolver();
  }
};

// Álbum de recuerdos: guarda las fotos (copias del lienzo) y dibuja polaroids
const Album = {
  fotos: [],

  // Polaroid centrada en (cx,cy); todo (marco, pie, texto) escala con s
  polaroid(ctx, f, cx, cy, s) {
    const w = CFG.ANCHO * s, h = CFG.ALTO * s, m = 8 * s, pie = 30 * s;
    ctx.fillStyle = '#f4ecdc';
    ctx.fillRect(Math.round(cx - w / 2 - m), Math.round(cy - h / 2 - m), Math.round(w + 2 * m), Math.round(h + 2 * m + pie));
    ctx.drawImage(f.img, Math.round(cx - w / 2), Math.round(cy - h / 2), Math.round(w), Math.round(h));
  },

  // Hasta 4 miniaturas de las últimas fotos en la pantalla de inicio
  miniaturas(ctx) {
    const ult = this.fotos.slice(-4);
    ult.forEach((f, k) => this.polaroid(ctx, f, CFG.ANCHO / 2 + (k - (ult.length - 1) / 2) * 84, 180, .17));
  }
};

// Cubierta de los niveles del altar: textura procedural en pixel art.
// En Yucatán la mesa del altar se cubre con hojas de plátano: tiras verdes con nervadura central clara,
// venas paralelas y alguna rasgadura. (Antes era un mantel blanco bordado; se conserva el nombre «Mantel»
// del objeto para no tocar el resto del juego.)
const Mantel = {
  HOJA: true,                 // false = vuelve al mantel blanco bordado
  VERDES: [[46, 112, 52], [60, 132, 60], [38, 98, 46]],
  NERVIO: [178, 214, 132], VENA: [92, 156, 78], RASGO: [24, 66, 32],
  ANCHO_HOJA: 14,             // px de textura por tira de hoja
  // Color de hoja en (u, v): u = a lo ancho de las tiras, v = a lo largo (px de textura)
  hoja(u, v) {
    const tira = Math.floor(u / this.ANCHO_HOJA), du = u - tira * this.ANCHO_HOJA, c = this.ANCHO_HOJA / 2;
    if (Math.abs(du - c) < .9) return this.NERVIO;                         // nervadura central
    if (du < .8) return this.RASGO;                                         // orilla donde se enciman
    if (((Math.floor(v) + Math.floor(Math.abs(du - c))) % 4) === 0) return this.VENA;   // venas paralelas
    if (Sprites.ruido(tira, Math.floor(v / 3)) % 23 === 0 && Math.abs(du - c) > 2) return this.RASGO;   // rasgaduras
    return this.VERDES[((tira % 3) + 3) % 3];
  },
  K: 16,                      // píxeles de textura por unidad de mundo
  ANCHO: 5,                   // ancho de la franja bordada (px)
  TELA: [244, 240, 230],      // blanco hueso
  HILO: [255, 253, 246],      // hilo blanco del bordado (algo más claro que la tela)
  PUNTADA: [208, 200, 184],   // puntada de contorno (gris cálido)
  HUECO: [96, 66, 52],        // calado: deja ver la madera de la mesa

  // Color del bordado a distancia d del borde y posición t a lo largo de él (ambos en px); null = tela lisa
  bordado(d, t) {
    if (d >= this.ANCHO) return null;                  // fuera de la franja: tela lisa
    if (Math.floor(d) === 0 || Math.floor(d) === this.ANCHO - 1) return this.PUNTADA; // líneas de puntada
    const tm = ((t % 10) + 10) % 10 - 5, bm = d - 2.5;  // posición relativa al centro del motivo (período de 10 px)
    const r2 = tm * tm + bm * bm;
    if (r2 < 1.6) return this.HUECO;                    // ojal calado
    if (r2 < 3.8) return this.PUNTADA;                  // contorno del ojal
    return this.HILO;                                   // relleno de hilo blanco
  },

  // Color del píxel de pantalla (sx, sy) para el nivel e. Invierte la proyección sobre cada cara visible
  // (superior, frontal-izquierda y derecha) y mide la distancia a sus bordes libres. null = fuera del prisma.
  color(e, caja, sx, sy) {
    const o = CFG.ORIGEN, hw = CFG.TW / 2, hh = CFG.TH / 2, K = this.K;
    const zt = e.z + e.h, yf = e.y + e.d, xp = e.x + e.w, frente = yf >= caja.y1;  // techo, plano frontal (y) y plano derecho (x)
    let sombra, plie = 0, cands, uv;                            // cands = [[distancia al borde, coord. a lo largo], ...]
    const m = Iso.aMundo(sx, sy, zt);
    if (m.x >= e.x && m.x < xp && m.y >= e.y && m.y < yf) {            // cara superior: bordes libres = extremos y frente
      sombra = 1; uv = [m.x, m.y]; cands = [[m.x - caja.x0, m.y], [caja.x1 - m.x, m.y]];
      if (frente) cands.push([yf - m.y, m.x]);                         // el frente solo se borda en el nivel más bajo
    } else {
      const xa = (sx - o.x) / hw + yf, za = ((xa + yf) * hh + o.y - sy) / CFG.UZ;
      if (xa >= e.x && xa < xp && za >= e.z && za < zt) {              // cara frontal: extremos laterales y dobladillo inferior
        sombra = .88; plie = xa; uv = [xa, -za]; cands = [[xa - caja.x0, za], [caja.x1 - xa, za]];
        if (frente) cands.push([za - e.z, xa]);                         // dobladillo solo en el frente libre
      } else {
        const yb = xp - (sx - o.x) / hw, zb = ((xp + yb) * hh + o.y - sy) / CFG.UZ;
        if (!(yb >= e.y && yb < yf && zb >= e.z && zb < zt)) return null; // fuera del prisma: transparente
        sombra = .74; plie = yb; uv = [yb, -zb]; cands = [[zb - e.z, yb]];
        if (frente) cands.push([yf - yb, zb]);  // cara derecha: dobladillo inferior y borde frontal
      }
    }
    if (this.HOJA) {

    const c = this.bordado(d * K, t * K) || this.TELA;
    let f = sombra;
    if (c !== this.HUECO) {
      if ((Math.floor(sx) * 13 + Math.floor(sy) * 7) % 9 === 0) f *= .96;        // trama sutil de la tela

  // Genera los píxeles (RGBA) del nivel e dentro de su caja de pantalla. Función pura: no usa el DOM.

/* ============================================================
 * SPRITES DE OBJETOS — pixel art procedural, pre-renderizado y en caché.
 * Los ids sin sprite siguen dibujándose como prismas de color (marcador de posición).
 * ============================================================ */
const Sprites = {
  cache: {},
  VELAS: { vela: 1, veladoras: 1 },   // ids que usan el sprite de vela cilíndrica

  tiene(it) { return it.id in this.VELAS || it.id in this.GEN; },

  // Vela cilíndrica isométrica (RGBA). Mismo sombreado que el resto del juego: tapa clara, luz a la izquierda,
  // lado derecho oscuro. Incluye cera derretida, mecha y una sombra suave sobre la superficie. Función pura.
  pixelesVela(alto, hex) {
    const R = 6, RY = 3, W = 2 * (R + 3), cx = W / 2;   // radio, semialto de la elipse (2:1) y ancho del lienzo
    const yt = RY + 3, yb = yt + alto, H = yb + RY + 3; // centro de la tapa y centro de la base
    const base = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));

    const put = (px, py, c, a = 255) => data.set([c[0], c[1], c[2], a], (py * W + px) * 4);
    const tono = f => base.map(v => Math.min(255, Math.round(v * f)));

      const enCuerpo = Math.abs(dx) <= R && dy >= yt && dy <= yb + RY * Math.sqrt(Math.max(0, 1 - (dx / R) ** 2));
      if (enTapa) {   // tapa elíptica; la cera derretida alrededor de la mecha es un poco más oscura

        put(px, py, tono(cera ? .9 : 1));
      } else if (enCuerpo) {   // 3 bandas: brillo a la izquierda, tono medio y lado oscuro a la derecha
        put(px, py, tono(dx < -3.5 ? 1 : dx < 1 ? .88 : .7));
      } else if ((dx / (R + 2.5)) ** 2 + ((dy - yb) / (RY + 1.5)) ** 2 <= 1) {

      }

  },

  // Generador (método) por id para los objetos que no son velas. Cada uno devuelve un lienzo {W,H,data,ax,ay,alto}.

    agua: 'pixelesAgua', bebida: 'pixelesAtole', mandarina: 'pixelesMandarina', jicama: 'pixelesJicama',
    sal: 'pixelesSal', ceniza: 'pixelesCeniza', petalos: 'pixelesPetalos',
    escabeche: 'pixelesEscabeche', dulce: 'pixelesDulce', dulce2: 'pixelesDulce',
    cigarros: 'pixelesCigarros', espejo: 'pixelesEspejo', rosario: 'pixelesRosario', cerveza: 'pixelesCerveza', comida: 'pixelesTamal', copal: 'pixelesCopal', foto: 'pixelesFoto', cruz: 'pixelesCruz'
  },

  // ---- Utilidades de dibujo por píxeles (funciones puras) ----

  sh: (c, f) => c.map(v => Math.min(255, Math.round(v * f))),          // oscurece (f<1) o aclara (f>1) un color
  el: (dx, dy, rx, ry) => (dx / rx) ** 2 + (dy / ry) ** 2 <= 1,        // ¿(dx,dy) cae dentro de la elipse?

  // Lienzo RGBA con put(x, y, color, alfa)

  aCanvas(L) {

  cilindro(L, cx, yt, R, alto, o) {

  pixelesCeniza(it) {

  pixelesPetalos(it) {

                   ['t', [P(u0, v0, zt), P(u1, v0, zt), P(u1, v1, zt), P(u0, v1, zt)]]];
    for (let py = 0; py < L.H; py++) for (let px = 0; px < L.W; px++)

  pixelesEscabeche(it) {

    for (let x = cx - 4; x <= cx + 4; x += 2) L.put(x, yt + alto - 3, [60, 90, 150]);                       // franja azul decorativa
    L.put(cx - 3, yt - 1, [246, 238, 222]); L.put(cx - 2, yt - 1, [234, 222, 200]); L.put(cx - 3, yt, [222, 206, 180]);   // pieza de pollo
    L.put(cx - 1, yt, [172, 104, 168]); L.put(cx, yt - 1, [158, 88, 154]); L.put(cx + 1, yt, [172, 104, 168]);            // cebolla morada encurtida
    L.put(cx + 2, yt - 1, [244, 196, 60]); L.put(cx + 3, yt, [232, 176, 48]);                            // chile xcatic
    L.put(cx + 2, yt + 2, [250, 170, 60]); L.put(cx + 3, yt + 2, [240, 150, 40]);                         // rodaja de naranja agria

  },

  // Fotografía de difunto: marco de madera con flores de cempasúchil, encaje y un retrato sepia ABSTRACTO (silueta sin rasgos, nada reconocible)
  pixelesFoto(it) {
    const L = this.lienzo(20, 26), naranja = [[244, 130, 30], [255, 168, 56], [214, 92, 20]];

  },

  // Cruz verde de madera pintada: base escalonada, poste y travesaño; la silueta mide 28 px de alto (de la base al extremo del poste)
  pixelesCruz(it) {
    const cx = 12, cy = 32, L = this.lienzo(24, 40);
    for (let py = 0; py < 40; py++) for (let px = 0; px < 24; px++) if (this.el(px + .5 - cx, py + .5 - cy, 12, 5.5)) L.put(px, py, [60, 40, 70], 70);
    const verde = (cara, px, py) => {
      const c = cara === 'l' ? [64, 184, 140] : cara === 'r' ? [38, 140, 104] : [104, 218, 174];
      return this.ruido(px, py) % 9 === 0 ? this.sh(c, .9) : c;   // pintura con ligeras imperfecciones
    };
    this.prisma(L, cx, cy, .2, .2, .8, .8, 0, 3, verde);         // base ancha
    this.prisma(L, cx, cy, .38, .38, .62, .62, 3, 2, verde);     // escalón

  // Cajetilla de cigarros abierta: caja blanca con marco negro y 3 cigarros que asoman por la boca
  pixelesCigarros(it) {
    const cx = 14, cy = 14, hpx = 4, L = this.lienzo(28, 24);
    for (let py = 0; py < 24; py++) for (let px = 0; px < 28; px++) if (this.el(px + .5 - cx, py + .5 - cy, 11, 4.5)) L.put(px, py, [60, 40, 70], 70);
    this.prisma(L, cx, cy, .15, .3, .85, .7, 0, hpx, (cara, px, py) => {
      if (cara === 'l') return [226, 226, 232];
      if (cara === 'r') return [190, 190, 202];

      const q = Math.min(u - .3, .7 - u, v - .38, .62 - v);   // marco negro de la etiqueta

    });
    for (const v of [.42, .5, .58]) for (let t = 0; t < 6; t++) {   // cigarros: punta naranja (filtro) y papel blanco

  // Espejo ovalado con marco de mimbre dorado, luna con brillo diagonal y soporte
  pixelesEspejo(it) {
    const cx = 9, L = this.lienzo(18, 25), oro = this.rgb('#c9a054');

      } else if (px >= cx - 3 && px < cx + 3 && py >= 20 && py <= 21) L.put(px, py, this.sh(oro, .7));
      else if (this.el(dx, py + .5 - 22, 7, 2.4)) L.put(px, py, [60, 40, 70], 70);
    }

  },

  // Rosario de cuentas de madera en círculo sobre la superficie, con crucifijo oscuro y Cristo plateado
  pixelesRosario(it) {
    const cx = 12, cy = 9, L = this.lienzo(24, 22);
    for (let py = 0; py < 22; py++) for (let px = 0; px < 24; px++) if (this.el(px + .5 - cx, py + .5 - cy - 1, 11, 6.5)) L.put(px, py, [60, 40, 70], 60);
    for (let k = 0; k < 16; k++) {
      if (k === 4) continue;   // aquí cuelga la cruz

      L.put(x - 1, y - 1, [216, 178, 116]); L.put(x, y - 1, [238, 208, 150]); L.put(x - 1, y, [196, 150, 92]); L.put(x, y, [160, 116, 66]);

    for (let y = cy + 6; y <= cy + 9; y++) L.put(cx - 1, y, [214, 214, 226]);   // Cristo plateado

  // Cerveza: vaso tipo pinta ligeramente cónico, líquido ámbar, corona de espuma y brillo
  pixelesCerveza(it) {
    const R = 5, alto = Math.round(it.h * 16), cx = 8, yt = 6, L = this.lienzo(16, yt + alto + 8);
    this.cilindro(L, cx, yt, R, alto, { c: [226, 148, 28], t: [250, 242, 214], r: [255, 250, 232], rb: 4 });
    for (let py = yt + 1; py <= yt + 4; py++) for (let px = cx - R; px < cx + R; px++) {   // espuma

    }
    for (let y = yt + 6; y < yt + alto - 1; y++) L.put(cx - 3, y, [255, 214, 110]);   // brillo
    for (let x = cx - 3; x < cx + 3; x++) L.put(x, yt + alto - 1, [196, 186, 160]);   // base de vidrio
    return Object.assign(L, { ax: cx, ay: yt + alto, alto });
  },

  // Tamales en hoja de maíz sobre plato de barro con borde calado (2 abajo y 1 encima)
  pixelesTamal(it) {
    const cx = 13, yt = 12, L = this.lienzo(26, 23);
    this.cilindro(L, cx, yt, 11, 1, { c: [150, 66, 28], t: [196, 98, 44], r: [214, 124, 64] });
    for (let k = 0; k < 14; k++) { const a = k / 14 * Math.PI * 2; L.put(Math.round(cx + 9 * Math.cos(a)), Math.round(yt + 4.5 * Math.sin(a)), [244, 226, 196]); }   // borde calado
    const hoja = (cara, px, py) => cara === 'l' ? [214, 168, 98] : cara === 'r' ? [166, 122, 66] : (px + py * 2) % 4 === 0 ? [196, 148, 78] : [232, 192, 118];
    this.prisma(L, cx, yt, .25, .12, .75, .42, 1, 4, hoja);
    this.prisma(L, cx, yt, .25, .58, .75, .88, 1, 4, hoja);
    this.prisma(L, cx, yt, .32, .34, .68, .66, 5, 3, hoja);
    return Object.assign(L, { ax: cx, ay: yt + 1, alto: 8 });
  },

  // Copal: brasero de barro con tres patas y grecas, carbón con brasas y trocitos de resina dorada (el humo se anima al dibujar)
  pixelesCopal(it) {
    const cx = 11, yt = 9, alto = 5, yb = yt + alto, L = this.lienzo(22, 25), barro = this.rgb('#b0703f');
    this.cilindro(L, cx, yt, 8, alto, { c: barro, t: [34, 28, 32], r: this.sh(barro, 1.15), rb: 6 });
    for (let x = cx - 5; x <= cx + 4; x += 3) L.put(x, yt + 3, [240, 204, 150]);   // grecas
    for (let py = 0; py < 25; py++) for (let px = 0; px < 22; px++) if (this.el(px + .5 - cx, py + .5 - yt, 3.6, 1.8)) L.put(px, py, [74, 66, 70]);   // carbón
    L.put(cx - 3, yt + 1, [210, 64, 40]); L.put(cx + 2, yt + 1, [210, 64, 40]);
    for (const [x, y] of [[-1, -1], [0, -1], [0, 0], [1, 0]]) L.put(cx + x, yt + y, [240, 200, 92]);   // resina
    for (const x of [-5, 4]) for (let y = yb + 3; y <= yb + 5; y++) { L.put(cx + x, y, this.sh(barro, .75)); L.put(cx + x + 1, y, this.sh(barro, .6)); }   // patas
    return Object.assign(L, { ax: cx, ay: yb, alto });
  },

  // Dulce tradicional: plato blanco con una laja de dulce café brillante (como en la referencia)
  pixelesDulce(it) {
    const cx = 11, yt = 9, L = this.lienzo(22, 19);
    this.cilindro(L, cx, yt, 8, 1, { c: [200, 200, 208], t: [236, 236, 242], r: [214, 214, 222] });   // plato
    const base = this.rgb(it.color);   // color del caramelo: cada dulce puede tener su propio tono
    this.prisma(L, cx, yt, .16, .26, .84, .74, 0, 3, (cara, px, py) => {
      if (cara === 'l') return this.sh(base, .82);
      if (cara === 'r') return this.sh(base, .63);

      return r === 0 ? this.sh(base, 1.8) : r < 3 ? this.sh(base, 1.2) : base;   // caramelo con brillos
    });
