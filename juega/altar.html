  },

  // Cesto de paja trenzada (2x2 celdas): cilindro con trama de vueltas, boca con aro y tapa plana con cordón
  crearCesto(vacio) {
    const R = 12, alto = 14, cx = 16, yt = 10, yb = yt + alto, paja = this.rgb('#e8d3a6');
    const trama = (px, py) => (py % 3 === 0 ? .85 : 1) * ((px + (Math.floor(py / 3) % 2) * 2) % 4 === 0 ? .93 : 1);   // vueltas y puntadas
    const B = this.lienzo(32, yb + 11);
    this.cilindro(B, cx, yt, R, alto, { c: paja, t: vacio ? [138, 112, 78] : [58, 42, 26], r: this.sh(paja, 1.1), f: trama });
    const T = this.lienzo(30, 22), tx = 15, ty = 10;
    this.cilindro(T, tx, ty, 13, 2, { c: this.sh(paja, .9), t: this.sh(paja, 1.05), r: this.sh(paja, .8), sombra: false, f: trama });
    for (const [x, y] of [[4, -3], [5, -4], [6, -4], [7, -3], [7, -2]]) T.put(tx + x, ty + y, [196, 170, 120]);   // cordón de la tapa
    return { cuerpo: this.aCanvas(B), tapa: this.aCanvas(T), ax: cx, ay: yb, tx, ty, alto, dz: 2 };
  },

  // Caja de cartón (2x2 celdas): prisma color cartón con la boca abierta (interior oscuro) y una tapa con cinta de embalaje
  crearCaja(vacio) {
    const hpx = 14, cx = 26, cy = 28, a = -.2, b = 1.2;   // la caja ocupa de -0.2 a 1.2 celdas por lado (1.4 de lado)
    const lado = { l: [214, 183, 127], r: [185, 150, 96] }, B = this.lienzo(52, 48), T = this.lienzo(52, 28);
    for (let py = 0; py < 48; py++) for (let px = 0; px < 52; px++)   // sombra suave en el suelo
      if (this.el(px + .5 - cx, py + .5 - cy, 24, 11)) B.put(px, py, [60, 40, 70], 70);
    this.prisma(B, cx, cy, a, a, b, b, 0, hpx, (cara, px, py) => {
      if (cara !== 't') return lado[cara];
      // (u, v) del píxel sobre la cara superior: dibuja el borde de cartón alrededor del hueco oscuro
      const dx = px + .5 - cx, dy = py + .5 - (cy - hpx), u = dx / 32 + dy / 16 + .5, v = dy / 16 - dx / 32 + .5;
      const borde = u < a + .12 || u > b - .12 || v < a + .12 || v > b - .12;
      return borde ? [228, 203, 155] : vacio ? [120, 94, 62] : [42, 28, 16];
    });
    this.prisma(T, cx, 14, a, a, b, b, 0, 2, (cara, px, py) => {   // tapa: solapas cerradas con cinta a lo largo
      if (cara !== 't') return lado[cara];
      const dx = px + .5 - cx, dy = py + .5 - 12, v = dy / 16 - dx / 32 + .5;
      return Math.abs(v - .5) < .025 ? [150, 122, 80] : Math.abs(v - .5) < .1 ? [240, 226, 190] : [228, 203, 155];
    });
    return { cuerpo: this.aCanvas(B), tapa: this.aCanvas(T), ax: cx, ay: cy, tx: cx, ty: 14, alto: hpx, dz: 0 };
  },

  // Olla de peltre turquesa (recipiente de 2x2 celdas): cuerpo con asas azules y tapa con perilla.
  // La tapa es un sprite aparte para poder animarla (sube y se desvanece al abrir). vacio = interior más claro.
  crearOlla(vacio) {
    const R = 13, alto = 16, cx = 19, yt = 11, yb = yt + alto, azul = [31, 58, 122], tq = this.rgb('#3b9aa3');
    const B = this.lienzo(38, yb + 11);
    this.cilindro(B, cx, yt, R, alto, { c: tq, t: vacio ? [58, 46, 68] : [21, 15, 26], r: azul, p: [235, 245, 245] });
    for (const lado of [-1, 1]) {   // asas a ambos lados
      const x0 = lado < 0 ? cx - R - 3 : cx + R;
      for (let x = 0; x < 3; x++) for (let y = 0; y < 6; y++) B.put(x0 + x, yt + 3 + y, azul);
      B.put(x0 + 1, yt + 5, tq); B.put(x0 + 1, yt + 6, tq);   // hueco del asa
    }
    const T = this.lienzo(32, 24), tx = 16, ty = 13;          // (tx, ty) = centro de la cara superior de la tapa
    this.cilindro(T, tx, ty, 14, 2, { c: this.sh(tq, .8), t: this.sh(tq, 1.1), r: azul, sombra: false, p: [235, 245, 245] });
    for (let x = tx - 1; x <= tx + 1; x++) { T.put(x, ty - 4, azul); T.put(x, ty - 3, this.sh(tq, 1.1)); T.put(x, ty - 2, this.sh(tq, 1.1)); }   // perilla
    return { cuerpo: this.aCanvas(B), tapa: this.aCanvas(T), ax: cx, ay: yb, tx, ty, alto, dz: 2 };
  },

  // Contenedores con sprite (cuerpo + tapa animada): tipo -> método que los crea
  CONT: { olla: 'crearOlla', cesto: 'crearCesto', caja: 'crearCaja' },

  obtenerCont(tipo, vacio) {
    const k = tipo + (vacio ? 1 : 0);
    return this.cache[k] || (this.cache[k] = this[this.CONT[tipo]](vacio));
  },

  // Cuerpo del contenedor (con el interior oscuro; más claro si ya está vacío), centrado en su huella
  dibujarCont(ctx, r) {
    const s = this.obtenerCont(r.tipo, r.abierto && r.estaVacio), p = Iso.aPantalla(r.x + r.w / 2, r.y + r.d / 2, r.z);
    ctx.drawImage(s.cuerpo, p.sx - s.ax, p.sy - s.ay);
  },

  // Tapa: se asienta sobre el borde y sube hasta 18 px mientras se abre (la opacidad la maneja Recipiente)
  dibujarTapaCont(ctx, r) {
    const s = this.obtenerCont(r.tipo, false), p = Iso.aPantalla(r.x + r.w / 2, r.y + r.d / 2, r.z);
    ctx.drawImage(s.tapa, p.sx - s.tx, p.sy - s.alto - s.dz - Math.round(r.animTapa * 18) - s.ty);
  },

  // Crea el sprite una sola vez por id
  obtener(it) {
    const k = `${it.id}|${it.w}x${it.d}|${it.rot % 2}`;   // los sprites planos o de papel dependen de la orientación
    if (!this.cache[k]) {
      const s = this.GEN[it.id] ? this[this.GEN[it.id]](it) : this.pixelesVela(Math.round(it.h * 16), it.color), c = document.createElement('canvas');
      c.width = s.W; c.height = s.H;
      c.getContext('2d').putImageData(new ImageData(s.data, s.W, s.H), 0, 0);
      this.cache[k] = { img: c, ax: s.ax, ay: s.ay, alto: s.alto, W: s.W, H: s.H, data: s.data };   // data (RGBA) sirve para saber qué píxeles son visibles
    }
    return this.cache[k];
  },

  // ¿El punto de pantalla (sx, sy) cae sobre un píxel visible del dibujo del objeto? (alfa > 100 descarta la sombra)
  // Tolerancia de 1 px (invisible a la escala del juego); los pétalos, que son píxeles sueltos, usan 5 px.
  golpe(it, sx, sy) {
    const s = this.obtener(it), p = Iso.aPantalla(it.x + it.w / 2, it.y + it.d / 2, it.z);
    const lx = Math.floor(sx - (p.sx - s.ax)), ly = Math.floor(sy - (p.sy - s.ay)), R = it.id === 'petalos' ? 5 : 1;
    if (it.id === 'rosario' && this.el(lx + .5 - 12, ly + .5 - 9, 10.5, 5.5)) return true;   // rosario: el hueco del aro también se agarra (solo la hitbox; el dibujo no cambia)
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const x = lx + dx, y = ly + dy;
      if (x >= 0 && y >= 0 && x < s.W && y < s.H && s.data[(y * s.W + x) * 4 + 3] > 100) return true;
    }
    return false;
  },

  // Contorno brillante (2 px de grosor) alrededor de los píxeles visibles del sprite; se calcula una vez y queda en caché
  contorno(s) {
    if (s.cont) return s.cont;
    const W = s.W + 4, H = s.H + 4, L = this.lienzo(W, H);
    const op = (x, y) => x >= 0 && y >= 0 && x < s.W && y < s.H && s.data[(y * s.W + x) * 4 + 3] > 100;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const sx = x - 2, sy = y - 2; if (op(sx, sy)) continue;
      let d = 3;   // distancia (Chebyshev) al píxel visible más cercano
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (op(sx + dx, sy + dy)) d = Math.min(d, Math.max(Math.abs(dx), Math.abs(dy)));
      if (d === 1) L.put(x, y, [255, 240, 130]); else if (d === 2) L.put(x, y, [255, 200, 60], 140);
    }
    return s.cont = this.aCanvas(L);
  },

  // Dibuja el objeto centrado en su huella y a su altura actual (también cuando levita en la mano)
  dibujar(ctx, it) {
    const s = this.obtener(it), p = Iso.aPantalla(it.x + it.w / 2, it.y + it.d / 2, it.z);
    if (it === Escena.agarrable && !it.enMano) {   // objeto bajo el cursor: contorno brillante que late un poco
      ctx.globalAlpha = .8 + .2 * Math.sin(Juego.reloj * 6);
      ctx.drawImage(this.contorno(s), p.sx - s.ax - 2, p.sy - s.ay - 2);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(s.img, p.sx - s.ax, p.sy - s.ay);
    if (it.id === 'copal') {   // humo del copal: hilo ondulante que sube y se desvanece
      ctx.fillStyle = '#e6e1ec';
      for (let k = 0; k < 12; k++) {
        ctx.globalAlpha = .55 * (1 - k / 12);
        ctx.fillRect(p.sx + Math.round(Math.sin(Juego.reloj * 2.2 + k * .7) * (1 + k * .3)) - 1, p.sy - s.alto - 2 - k * 2, 2, 1);
      }
      ctx.globalAlpha = 1; return;
    }
    if (!(it.id in this.VELAS)) return;   // solo las velas tienen llama
    // Llama animada: 2 cuadros que parpadean, desfasados según la posición para que no latan todas a la vez
    const f = Math.floor(Juego.reloj * 6 + it.x * 3 + it.y) % 2, b = p.sy - s.alto - 2;   // b = punta de la mecha
    ctx.fillStyle = '#ff8a1a'; ctx.fillRect(p.sx - 1, b - 3, 2, 3);        // cuerpo de la llama
    ctx.fillRect(p.sx - f, b - 5, 1, 2);                                    // punta que oscila de lado
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(p.sx - 1 + f, b - 2, 1, 2);    // núcleo claro
  }
};

// Paredes: albarrada, el muro de piedra seca (sin mezcla) que rodea los solares en Yucatán.
// Piedras de caliza irregulares, acomodadas en hiladas, con huecos oscuros y algo de musgo.
// Se pre-renderizan una vez por pared (invierten la proyección en cada cara visible, igual que el mantel).
const Pared = {
  OSCURO: .62,   // luminosidad global (las paredes no deben robar atención a los objetos)
  PAL: [[214, 206, 188], [196, 188, 168], [226, 218, 198], [182, 172, 152], [204, 194, 172], [170, 162, 146]],
  MUSGO: [96, 122, 74], HUECO: [44, 36, 32],
  // Color de la piedra en el píxel de pantalla (sx, sy): hiladas de ~6 px, piedras de 7 a 12 px de ancho
  _filas: null,
  // Hiladas de alto variable (4 a 7 px): tabla de inicio de cada hilada
  filas() {
    if (!this._filas) { this._filas = []; for (let y = -40, f = 0; y < CFG.ALTO + 40; f++) { const h = 4 + Sprites.ruido(f, 5) % 4; this._filas.push([y, h]); y += h; } }
    return this._filas;
  },
  hebra(sx, sy) {
    const F = this.filas();
    let fila = 0; while (fila < F.length - 1 && F[fila + 1][0] <= sy) fila++;
    const [y0, alto] = F[fila], fy = sy - y0;
    // piedras de ancho variable (5 a 13 px) dentro de cada hilada
    let x = -60 - Sprites.ruido(fila, 11) % 9, col = 0, ancho = 0;
    while (true) { ancho = 5 + Sprites.ruido(col + 50, fila) % 9; if (x + ancho > sx) break; x += ancho; col++; }
    const fx = sx - x, r = Sprites.ruido(col + 300, fila + 300);
    // esquinas redondeadas: las piedras no son ladrillos
    const esquina = (fx < 1.5 || fx > ancho - 1.5) && (fy < 1.5 || fy > alto - 1.5);
    if (fy < 1 || fx < 1 || esquina) return this.HUECO;               // hueco entre piedras
    if (r % 13 === 0 && fy > alto / 2) return this.MUSGO;              // musgo
    const p = this.PAL[r % this.PAL.length];
    const luz = fy < 2 ? 1.1 : fy > alto - 2 ? .82 : (Sprites.ruido(Math.floor(sx), Math.floor(sy)) % 7 === 0 ? .92 : 1);
    return p.map(v => Math.min(255, v * luz));
  },
  color(e, sx, sy) {
    const o = CFG.ORIGEN, hw = CFG.TW / 2, hh = CFG.TH / 2, zt = e.z + e.h, yf = e.y + e.d, xp = e.x + e.w;
    let f;
    const m = Iso.aMundo(sx, sy, zt);
    if (m.x >= e.x && m.x < xp && m.y >= e.y && m.y < yf) f = 1;          // cara superior
    else {
      const xa = (sx - o.x) / hw + yf, za = ((xa + yf) * hh + o.y - sy) / CFG.UZ;
      if (xa >= e.x && xa < xp && za >= e.z && za < zt) f = .88;          // cara frontal-izquierda
      else {
        const yb = xp - (sx - o.x) / hw, zb = ((xp + yb) * hh + o.y - sy) / CFG.UZ;
        if (!(yb >= e.y && yb < yf && zb >= e.z && zb < zt)) return null; // fuera del prisma
        f = .72;                                                           // cara derecha (la más oscura)
      }
    }
    return this.hebra(sx, sy).map(v => Math.round(v * f * this.OSCURO));
  },
  aplicar(lista) {
    for (const e of lista) {
      const P = [];
      for (const x of [e.x, e.x + e.w]) for (const y of [e.y, e.y + e.d]) for (const z of [e.z, e.z + e.h]) P.push(Iso.aPantalla(x, y, z));
      const x0 = Math.min(...P.map(p => p.sx)), y0 = Math.min(...P.map(p => p.sy));
      const W = Math.max(...P.map(p => p.sx)) - x0 + 1, H = Math.max(...P.map(p => p.sy)) - y0 + 1, d = new Uint8ClampedArray(W * H * 4);
      for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
        const c = this.color(e, x0 + px + .5, y0 + py + .5);
        if (c) d.set([c[0], c[1], c[2], 255], (py * W + px) * 4);
      }
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      cv.getContext('2d').putImageData(new ImageData(d, W, H), 0, 0);
      e.sprite = { img: cv, ox: x0, oy: y0 };
    }
  }
};

// Efectos del escenario: pétalos de cempasúchil que estallan cuando un recipiente se vacía
const Efectos = {
  lista: [],

  // Estallido de pétalos en el punto de pantalla (sx, sy)
  petalos(sx, sy) {
    const cols = ['#ff9a00', '#ffc23a', '#f2f2f2'];
    for (let k = 0; k < 28; k++) {
      const a = Math.random() * Math.PI * 2, v = 15 + Math.random() * 40;
      this.lista.push({ x: sx, y: sy, vx: Math.cos(a) * v, vy: Math.sin(a) * v * .6 - 25, t: 0, vida: .8 + Math.random() * .6, c: cols[k % 3] });
    }
  },

  actualizar(dt) {
    for (const p of this.lista) { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 40 * dt; } // gravedad suave
    this.lista = this.lista.filter(p => p.t < p.vida);                                              // descarta los que expiraron
  },

  // Cada pétalo es un cuadrito de 2x2 px que se desvanece con su vida
  dibujar(ctx) {
    for (const p of this.lista) { ctx.globalAlpha = 1 - p.t / p.vida; ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), 2, 2); }
    ctx.globalAlpha = 1;
  }
};

const TACTIL = matchMedia('(pointer: coarse)').matches;   // pantalla táctil: se coloca con el botón, no con el toque

// Estado global del juego: inicio -> colocando -> comprobando -> (corrigiendo) -> foto -> inicio
const Juego = {
  estado: 'inicio', reloj: 0,
  tFoto: 0, capturar: false,           // temporizador de la secuencia de foto y orden de captura
  info: document.getElementById('info'),
  BTN: { x: 86, y: 92, w: 180, h: 40 }, // botón "Empezar a jugar" (coordenadas del lienzo)
  mensajes: {
    es: {
      inicio: '',
      colocando: TACTIL ? 'Toca un recipiente para sacar un objeto · Toca una celda para mover la vista previa · Pulsa Colocar para soltarlo · Girar para rotar' : 'Clic en un recipiente para sacar un objeto · Clic para colocarlo · R, rueda o botón Girar: girar 90°',
      comprobando: 'Comprobando el altar…',
      corrigiendo: 'Mueve los objetos en rojo a un lugar correcto (puedes reordenar cualquiera)',
      foto: '¡Altar completo!'
    },
    en: {
      inicio: '',
      colocando: TACTIL ? 'Tap a container to take out an object · Tap a cell to move the preview · Press Place to drop it · Rotate to turn' : 'Click a container to take out an object · Click to place it · R, wheel or Rotate button: turn 90°',
      comprobando: 'Checking the altar…',
      corrigiendo: 'Move the red objects to a correct spot (you can rearrange any of them)',
      foto: 'Altar complete!'
    }
  },

  // Solo se interactúa con la escena al colocar o corregir (comprobando y foto quedan congelados)
  interactivo() { return this.estado === 'colocando' || this.estado === 'corrigiendo'; },

  cambiar(e) { this.estado = e; this.info.textContent = this.mensajes[LANG][e]; },

  // Clic en la pantalla de título: ¿sobre el botón?
  clicInicio(sx, sy) {
    const b = this.BTN;
    if (sx >= b.x && sx <= b.x + b.w && sy >= b.y && sy <= b.y + b.h) this.empezar();
  },

  // Nuevo altar: reinicia la escena (recipientes con contenido nuevo al azar)
  empezar() { Escena.iniciar(); this.cambiar('colocando'); },

  // Resolución: se pide la captura (se toma en el siguiente render) y arranca la secuencia de foto
  resolver() {
    Escena.entidades.forEach(e => e.destello = 0); // la foto sale sin contornos
    this.cambiar('foto'); this.tFoto = 0; this.capturar = true;
  },

  actualizar(dt) {
    this.reloj += dt;
    Comprobacion.actualizar(dt);
    Efectos.actualizar(dt);
    // Comprobación AUTOMÁTICA: cuando los 3 recipientes ya se vaciaron y retiraron y no hay nada en la mano
    if (this.estado === 'colocando' && Recipientes.todosVacios && !Mano.item) Comprobacion.iniciar();
    if (this.estado === 'foto' && (this.tFoto += dt) > 4) this.cambiar('inicio'); // tras mostrar la foto, vuelve al título
  },

  // Se llama al final de renderizar: captura la foto y pinta las capas superpuestas
  dibujar(ctx) {
    Efectos.dibujar(ctx);   // pétalos del escenario (encima de las entidades)
    if (this.capturar) {   // copia del lienzo ya dibujado (altar completo, sin interfaz)
      this.capturar = false;
      const c = document.createElement('canvas'); c.width = CFG.ANCHO; c.height = CFG.ALTO;
      c.getContext('2d').drawImage(canvas, 0, 0);
      Album.fotos.push({ img: c });
    }
    if (this.estado === 'inicio') this.dibujarInicio(ctx);
    if (this.estado === 'foto') {
      const t = this.tFoto, f = Album.fotos[Album.fotos.length - 1];
      ctx.fillStyle = 'rgba(22,14,30,.7)'; ctx.fillRect(0, 0, CFG.ANCHO, CFG.ALTO);
      if (t > .5) Album.polaroid(ctx, f, CFG.ANCHO / 2, CFG.ALTO / 2, .35 + .2 * Math.min(1, (t - .5) / .4)); // la polaroid crece
      if (t < .6) { ctx.fillStyle = `rgba(255,255,255,${1 - t / .6})`; ctx.fillRect(0, 0, CFG.ANCHO, CFG.ALTO); } // flash
    }
  },

  dibujarInicio(ctx) {
    ctx.fillStyle = 'rgba(22,14,30,.82)'; ctx.fillRect(0, 0, CFG.ANCHO, CFG.ALTO);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#f2a23a'; ctx.font = 'bold 26px monospace'; ctx.fillText('Altar de Hanal Pixán', CFG.ANCHO / 2, 62);
    const b = this.BTN;   // botón de inicio
    ctx.fillStyle = '#7a4a8c'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = '#f2a23a'; ctx.lineWidth = 1; ctx.strokeRect(b.x + .5, b.y + .5, b.w - 1, b.h - 1);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px monospace'; ctx.fillText(TEXTOS[LANG].iniciar, CFG.ANCHO / 2, b.y + 26);
    Album.miniaturas(ctx);
  }
};

/* ============================================================
 * 6. RENDER — Canvas con pixel art nítido
 * ============================================================ */
const canvas = document.getElementById('juego');
canvas.width = CFG.ANCHO; canvas.height = CFG.ALTO;
const ctx = canvas.getContext('2d', { alpha: false });
ctx.imageSmoothingEnabled = false;   // desactiva el suavizado al dibujar/escalar

// Escala el canvas por un factor ENTERO (si cabe) para píxeles perfectamente cuadrados
function ajustarEscala() {
  // Mide lo que ocupan la franja, la barra, el título y los botones (cambia entre celular parado y acostado)
  const acostado = matchMedia('(orientation: landscape) and (max-height: 520px)').matches;
  const alto = id => { const n = document.querySelector(id); return n && getComputedStyle(n).display !== 'none' && getComputedStyle(n).position !== 'fixed' ? n.offsetHeight + 10 : 0; };
  const libreAlto = acostado ? innerHeight - 22 : innerHeight - alto('.franja-bordado') - alto('.barra') - alto('.cabeza-juego') - alto('#ui') - 34;
  const libreAncho = acostado ? innerWidth - 240 : Math.min(innerWidth, 1100) - (innerWidth <= 480 ? 16 : 28);
  const s = Math.min(libreAncho / CFG.ANCHO, Math.max(libreAlto, 180) / CFG.ALTO);
  // En pantallas grandes, factor entero (píxeles perfectamente cuadrados); en el celular, lo que quepa
  const f = s >= 2 ? Math.floor(s) : s;
  canvas.style.width = Math.floor(CFG.ANCHO * f) + 'px';
  canvas.style.height = Math.floor(CFG.ALTO * f) + 'px';
}
addEventListener('resize', ajustarEscala);
addEventListener('orientationchange', () => setTimeout(ajustarEscala, 250));
document.querySelector('.cabeza-juego details').addEventListener('toggle', ajustarEscala);

// Dibuja una loseta (rombo) del suelo en la celda (i,j)
function dibujarLoseta(i, j, color, z = 0) { // z permite pintar sobre la superficie del altar
  const a = Iso.aPantalla(i, j, z), b = Iso.aPantalla(i + 1, j, z),
        c = Iso.aPantalla(i + 1, j + 1, z), d = Iso.aPantalla(i, j + 1, z);
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.lineTo(c.sx, c.sy); ctx.lineTo(d.sx, d.sy);
  ctx.closePath(); ctx.fill();
}

// Suelo de laja: lajas planas de piedra caliza, irregulares (celdas de Voronoi en coordenadas de mundo),
// con juntas de tierra roja. Se pre-renderiza UNA vez para todo el mapa.
const Piso = {
  img: null, ESC: 1.35,   // ESC: lajas por unidad de mundo (más = lajas más chicas)
  PAL: [[214, 202, 178], [200, 186, 160], [222, 212, 190], [190, 176, 150], [206, 192, 166], [184, 172, 150]],
  JUNTA: [128, 84, 58],   // tierra roja de Yucatán entre laja y laja
  semilla(i, j) {          // punto al azar (fijo) dentro de la celda (i, j)
    const r = Sprites.ruido(i + 777, j + 333);
    return [i + .15 + (r % 70) / 100, j + .15 + ((r >> 8) % 70) / 100, r];
  },
  crear() {
    const W = CFG.ANCHO, H = CFG.ALTO, d = new Uint8ClampedArray(W * H * 4);
    for (let py = 0; py < H; py++) for (let px = 0; px < W; px++) {
      const m = Iso.aMundo(px + .5, py + .5, 0);                       // píxel -> mundo (plano del suelo)
      if (m.x < 0 || m.y < 0 || m.x >= CFG.MAPA || m.y >= CFG.MAPA) continue;
      const u = m.x * this.ESC, v = m.y * this.ESC, ci = Math.floor(u), cj = Math.floor(v);
      let d1 = 9, d2 = 9, rr = 0;
      for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
        const [sx, sy, r] = this.semilla(ci + a, cj + b), dd = Math.hypot(u - sx, v - sy);
        if (dd < d1) { d2 = d1; d1 = dd; rr = r; } else if (dd < d2) d2 = dd;
      }
      let c;
      if (d2 - d1 < .07) c = this.JUNTA;                                 // junta de tierra
      else {
        const p = this.PAL[rr % this.PAL.length];
        let f = .82 * (Sprites.ruido(px, py) % 9 === 0 ? .9 : 1);       // motas de la piedra
        if (d2 - d1 < .14) f *= .9;                                      // orilla de la laja, un poco más oscura
        c = p.map(v => Math.round(v * f));
      }
      d.set([c[0], c[1], c[2], 255], (py * W + px) * 4);
    }
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').putImageData(new ImageData(d, W, H), 0, 0);
    this.img = cv;
  }
};

// Escenario alrededor del altar: cielo de noche con luna y palmas de huano detrás de las albarradas,
// tierra roja, un pozo de piedra (ch'e'en) y el fogón de tres piedras (k'óoben) con el comal y las tortillas.
// Todo queda FUERA de la rejilla del juego: no ocupa celdas ni estorba al colocar objetos.
const Escenario = {
  fondo: null, frente: null,
  lienzo() { const c = document.createElement('canvas'); c.width = CFG.ANCHO; c.height = CFG.ALTO; return c; },
  crear() {
    const W = CFG.ANCHO, H = CFG.ALTO;
    // ---- fondo: cielo y tierra ----
    const f = this.lienzo(), fc = f.getContext('2d'), img = fc.createImageData(W, H), d = img.data;
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      const m = Iso.aMundo(x + .5, y + .5, 0), k = (y * W + x) * 4;
      let c;
      if (m.x >= 0 && m.y >= 0) {                                        // delante de las albarradas: tierra
        const r = Sprites.ruido(x, y);
        c = r % 23 === 0 ? [124, 104, 86] : r % 5 === 0 ? [86, 54, 38] : [98, 62, 44];
        if (r % 61 === 0) c = [70, 104, 58];                             // hierbita
      } else {                                                           // detrás: cielo de noche
        const t = y / 110;
        c = [18 + 24 * t, 14 + 14 * t, 40 + 26 * t].map(Math.round);
        if (Sprites.ruido(x + 9, y + 3) % 211 === 0) c = [236, 228, 204];   // estrellas
      }
      d.set([c[0], c[1], c[2], 255], k);
    }
    fc.putImageData(img, 0, 0);
    const P = (ctx, x, y, col) => { ctx.fillStyle = col; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };
    // luna
    for (let y = -8; y <= 8; y++) for (let x = -8; x <= 8; x++) if (x * x + y * y <= 64) {
      P(fc, 26 + x, 18 + y, (x + 3) * (x + 3) + (y - 2) * (y - 2) < 6 || (x - 3) * (x - 3) + (y + 3) * (y + 3) < 3 ? '#dcd2b4' : '#f4ecd0');
    }
    // palmas de huano detrás de las paredes (el tronco queda escondido por la albarrada)
    const palma = (bx, by, alto, largo, sem) => {
      for (let y = 0; y < alto; y++) { P(fc, bx + Math.round(Math.sin(y / 9) * 1.5), by - y, '#4a3322'); P(fc, bx + 1 + Math.round(Math.sin(y / 9) * 1.5), by - y, '#5e4229'); }
      const cx = bx + Math.round(Math.sin(alto / 9) * 1.5), cy = by - alto, verdes = ['#2f6b34', '#3f8740', '#28592c', '#4c9a48'];
      for (let h = 0; h < 11; h++) {
        const a = Math.PI * (1.05 + h * .09), L = largo * (.75 + (Sprites.ruido(h, sem) % 30) / 100);
        for (let t = 0; t <= 1; t += .02) {
          const x = cx + Math.cos(a) * L * t * 1.3, y = cy + Math.sin(a) * L * t + L * .9 * t * t;
          P(fc, x, y, verdes[h % 4]); P(fc, x, y + 1, verdes[(h + 1) % 4]);
          if (t > .2 && Math.round(t * 50) % 3 === 0) { P(fc, x, y + 2, verdes[(h + 2) % 4]); P(fc, x, y + 3, verdes[(h + 3) % 4]); }   // hojuelas
        }
      }
      P(fc, cx, cy, '#6e4a2a');
    };
    palma(58, 92, 46, 22, 1); palma(108, 64, 44, 20, 2); palma(250, 64, 46, 22, 3); palma(300, 92, 40, 20, 4); palma(176, 34, 22, 15, 5);
    this.fondo = f;

    // ---- frente: pozo y fogón, por delante del piso ----
    const fr = this.lienzo(), g = fr.getContext('2d');
    const elipse = (cx, cy, rx, ry, col) => { for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++) if ((x * x) / (rx * rx) + (y * y) / (ry * ry) <= 1) P(g, cx + x, cy + y, col); };
    const piedra = (x, y, a, b) => {   // color de piedra caliza por bloques
      const fila = Math.floor(y / 4), col = Math.floor((x + fila * 3) / 6), r = Sprites.ruido(col + 40, fila + 90);
      if (y % 4 === 0 || (x + fila * 3) % 6 === 0) return '#3a2f2a';
      return ['#cfc6b2', '#bdb39c', '#d9d0bc', '#b0a68e'][r % 4];
    };
    // Pozo de piedra (ch'e'en) con su marco de madera, la cuerda y la cubeta
    { const cx = 40, top = 178, rx = 17, ry = 6, alto = 18;
      elipse(cx, top + alto + 4, 23, 8, 'rgba(40,24,18,.55)');                         // sombra en la tierra
      for (let x = -rx; x <= rx; x++) {
        const yb = Math.round(ry * Math.sqrt(1 - (x * x) / (rx * rx)));
        for (let y = top; y <= top + alto + yb; y++) {
          const base = piedra(cx + x, y), sombra = x < -rx * .5 ? .8 : x > rx * .5 ? .9 : 1;
          g.fillStyle = base; g.globalAlpha = 1; g.fillRect(cx + x, y, 1, 1);
          if (sombra < 1) { g.fillStyle = 'rgba(0,0,0,' + (1 - sombra) + ')'; g.fillRect(cx + x, y, 1, 1); }
        }
      }
      elipse(cx, top, rx, ry, '#ddd5c2'); elipse(cx, top, rx - 4, ry - 2, '#1b2a33');   // brocal y agua
      P(g, cx - 3, top - 1, '#6f93a6'); P(g, cx + 2, top, '#6f93a6');
      for (const px of [cx - rx - 2, cx + rx + 1]) for (let y = top - 28; y < top + 4; y++) { P(g, px, y, '#5e3d22'); P(g, px + 1, y, '#7a5230'); }
      for (let x = cx - rx - 3; x <= cx + rx + 3; x++) { P(g, x, top - 29, '#5e3d22'); P(g, x, top - 28, '#7a5230'); }
      for (let y = top - 27; y < top - 10; y++) P(g, cx, y, '#c9b48a');                       // soga
      for (let y = top - 10; y < top - 5; y++) for (let x = cx - 3; x <= cx + 3; x++) P(g, x, y, x === cx - 3 ? '#4f6b74' : '#7d9aa3');   // cubeta
      for (let x = cx - 3; x <= cx + 3; x++) P(g, x, top - 11, '#3b4f56');
    }
    // Fogón de tres piedras (k'óoben) con el comal, las tortillas y el lek
    { const cx = 296, cy = 188;
      elipse(cx, cy + 6, 27, 9, 'rgba(70,62,58,.9)');                                    // ceniza
      for (let k = 0; k < 26; k++) { const r = Sprites.ruido(k, 7); P(g, cx - 10 + r % 20, cy + 2 + (r >> 5) % 7, ['#ff7a1a', '#ffb02e', '#d9361a'][k % 3]); }   // brasas
      for (let y = -12; y <= 12; y++) for (let x = -26; x <= 26; x++) {                    // resplandor del fuego
        const q = (x * x) / 676 + (y * y) / 144; if (q < 1) { g.fillStyle = 'rgba(255,170,60,' + (.22 * (1 - q)).toFixed(3) + ')'; g.fillRect(cx + x, cy + y - 2, 1, 1); }
      }
      for (const [sx, sy] of [[cx - 15, cy + 1], [cx + 15, cy + 1], [cx, cy + 8]]) {       // las tres piedras
        elipse(sx, sy, 5, 4, '#9c9384'); elipse(sx - 1, sy - 1, 3, 2, '#c4bba9');
      }
      elipse(cx, cy - 4, 18, 6, '#3a3330'); elipse(cx, cy - 5, 17, 5, '#27211f');           // comal
      for (const [tx, ty] of [[cx - 7, cy - 6], [cx + 6, cy - 5]]) {                          // tortillas
        elipse(tx, ty, 6, 2, '#e8cf92'); P(g, tx - 2, ty, '#b88a4a'); P(g, tx + 3, ty - 1, '#b88a4a');
      }
      for (let k = 0; k < 14; k++) P(g, cx - 2 + Math.round(Math.sin(k) * 2), cy - 12 - k * 2, 'rgba(220,220,230,' + (.35 - k * .02) + ')');   // humo
      // lek con tortillas, a un lado
      elipse(cx + 34, cy + 9, 9, 7, '#c48d3e'); elipse(cx + 32, cy + 7, 4, 3, '#dba95a');
      for (let x = cx + 26; x <= cx + 42; x++) P(g, x, cy + 6, '#8a5a24');
      elipse(cx + 34, cy + 2, 6, 2, '#e8cf92');
      // olla de barro del otro lado
      elipse(cx - 34, cy + 8, 8, 8, '#a8582e'); elipse(cx - 36, cy + 5, 3, 3, '#c8784a'); elipse(cx - 34, cy, 5, 2, '#5e2e18');
    }
    this.frente = fr;
  }
};

function renderizar() {
  // Cielo, tierra y palmas (fuera de la rejilla)
  if (!Escenario.fondo) Escenario.crear();
  ctx.drawImage(Escenario.fondo, 0, 0);
  // Suelo de laja (siempre al fondo, no entra en el depth sorting)
  if (!Piso.img) Piso.crear();
  ctx.drawImage(Piso.img, 0, 0);
  ctx.drawImage(Escenario.frente, 0, 0);   // pozo y fogón, por delante del piso
  // Resalta la loseta bajo el cursor (resultado del mouse picking inverso)
  if (Escena.hover) dibujarLoseta(Escena.hover.i, Escena.hover.j, '#f2a93b66');
  // Entidades ordenadas del fondo al frente
  for (const e of ordenarProfundidad(Escena.entidades)) e.dibujar(ctx);
  Mano.dibujarPreview(); // celdas que ocuparía el objeto sostenido (verde/rojo)
  Mano.dibujarEtiqueta(ctx); // nombre del objeto sostenido
  Juego.dibujar(ctx);    // captura de foto + capas: pantalla de inicio, flash y polaroid
}

/* ============================================================
 * 7. ENTRADA — Pointer Events (ratón y táctil con el mismo código)
 * ============================================================ */
// Convierte coordenadas de la ventana a coordenadas del canvas interno
function posCanvas(ev) {
  const r = canvas.getBoundingClientRect();
  return { sx: (ev.clientX - r.left) * CFG.ANCHO / r.width, sy: (ev.clientY - r.top) * CFG.ALTO / r.height };
}
canvas.addEventListener('pointerdown', ev => {
  const { sx, sy } = posCanvas(ev);
  Mano.cursor = { sx, sy };
  if (Juego.estado === 'inicio') { Juego.clicInicio(sx, sy); return; } // pantalla de título
  if (!Juego.interactivo()) return;                                    // congelado en comprobación y foto
  // Con un objeto en la mano: el clic intenta colocarlo (y NO se puede sacar otro hasta lograrlo)
  if (Mano.item) { Mano.mover(sx, sy); if (ev.pointerType !== 'touch') Mano.colocar(); return; }   // táctil: el toque solo mueve la vista previa; se confirma con el botón
  // Mano vacía: 1) ¿objeto ya colocado? se vuelve a recoger. 2) si no, ¿recipiente? extrae uno.
  const r = Escena.recoger(sx, sy);
  if (r) Mano.tomar(r.e); else Recipientes.clic(sx, sy, Escena.entidades);
  Mano.inicio = { sx, sy };   // permite también arrastrar y soltar (ver pointerup)
});
canvas.addEventListener('pointermove', ev => {
  const { sx, sy } = posCanvas(ev);
  const m = Iso.aMundo(sx, sy, 0);                       // cursor -> plano del suelo
  const i = Math.floor(m.x), j = Math.floor(m.y);
  Escena.hover = (i >= 0 && j >= 0 && i < CFG.MAPA && j < CFG.MAPA) ? { i, j } : null;
  Mano.mover(sx, sy);   // el objeto sostenido sigue al cursor, ajustado a la rejilla
  Escena.agarrable = (Juego.interactivo() && !Mano.item) ? (Escena.recoger(sx, sy) || {}).e || null : null;   // objeto que se agarraría con un clic
});
// Arrastrar y soltar: si se pulsó y se movió más de 8 px, soltar el botón intenta colocar el objeto
canvas.addEventListener('pointerup', ev => {
  const { sx, sy } = posCanvas(ev), o = Mano.inicio; Mano.inicio = null;
  if (Mano.item && o && Math.hypot(sx - o.sx, sy - o.sy) > 8 && ev.pointerType !== 'touch') Mano.colocar();
});
// Rotación de 90°: rueda del ratón o tecla R
canvas.addEventListener('wheel', ev => { ev.preventDefault(); Mano.rotar(ev.deltaY > 0 ? 1 : -1); }, { passive: false });
addEventListener('keydown', ev => { if (ev.key === 'r' || ev.key === 'R') Mano.rotar(1); });

/* ============================================================
 * 8. BUCLE PRINCIPAL — requestAnimationFrame con delta time
 *    (dt se usará en fases futuras: animaciones, partículas, transiciones)
 * ============================================================ */
// Botones bajo el lienzo: girar (siempre visible) y colocar (solo táctil)
const btnRotar = document.getElementById('btnRotar'), btnColocar = document.getElementById('btnColocar');
// Etiquetas de los botones según el idioma
btnRotar.textContent = TEXTOS[LANG].girar;
btnRotar.setAttribute('aria-label', TEXTOS[LANG].ariaGirar);
btnColocar.textContent = TEXTOS[LANG].colocar;
btnRotar.addEventListener('click', () => Mano.rotar(1));
canvas.addEventListener('pointerleave', () => { Escena.agarrable = null; });
btnColocar.addEventListener('click', () => Mano.colocar());

let tPrev = 0;
function bucle(t) {
  const dt = Math.min((t - tPrev) / 1000, 0.1); // segundos; tope para evitar saltos al cambiar de pestaña
  tPrev = t;
  Recipientes.actualizar(dt, Escena.entidades); // animaciones de tapas, rebotes y caída de objetos
  Juego.actualizar(dt); // máquina de estados: comprobación, botón, foto y avance de año
  renderizar();
  const ok = Juego.interactivo(), it = Mano.item;   // los botones solo sirven con un objeto en la mano
  btnRotar.disabled = !(ok && it);
  btnColocar.disabled = !(ok && it && it.valido);
  requestAnimationFrame(bucle);
}

Escena.iniciar();
ajustarEscala();
addEventListener('load', ajustarEscala);   // otra vez cuando ya están los textos y la letra
requestAnimationFrame(bucle);
</script>
<script>
// Selector de idioma: mismo patrón del sitio, con recarga para que el juego repinte todo
(function () {
  var K = 'jaye-idioma', K2 = 'jaye-lang', b = document.querySelectorAll('.selector-idioma button');
  function poner(l) {
    document.documentElement.lang = l;
    document.querySelectorAll('[data-es]').forEach(function (el) { el.textContent = l === 'en' ? el.dataset.en : el.dataset.es; });
    b.forEach(function (btn) {
      var on = btn.dataset.lang === l;
      btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      btn.setAttribute('aria-label', btn.dataset.lang === 'en' ? 'English' : 'Español');
    });
    var a = document.querySelector('a[href^="index.html"]');
    if (a) a.href = 'index.html' + (l === 'en' ? '?lang=en' : '');
  }
  var q = new URLSearchParams(location.search).get('lang');
  var l = (q === 'en' || q === 'es') ? q : (localStorage.getItem(K) || localStorage.getItem(K2) || 'es');
  poner(l);
  b.forEach(function (btn) {
    btn.addEventListener('click', function () {
      var nl = this.dataset.lang;
      localStorage.setItem(K, nl);
      var u = new URL(location.href);
      u.searchParams.set('lang', nl);   // recarga con el idioma elegido
      location.href = u.toString();
    });
  });
})();
</script>
