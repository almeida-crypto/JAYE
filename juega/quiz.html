<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140c1f">
  <title>Quiz · Hanal Pixán</title>
  <link rel="preload" href="../assets/fonts/yeseva-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../assets/css/portada.css">
  <link rel="stylesheet" href="css/quiz.css">
</head>
<body>
  <div class="franja-bordado" aria-hidden="true"></div>
  <div class="envoltura">
    <div class="barra">
      <a class="volver-link" href="../index.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> <span data-es="Volver al inicio" data-en="Back to home"></span></a>
      <div class="selector-idioma" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button>
      </div>
    </div>

    <header class="cabecera-juega">
      <p class="eyebrow" data-es="Quiz" data-en="Quiz"></p>
      <h1 data-es="Quiz Hanal Pixán" data-en="Hanal Pixán Quiz"></h1>
      <p class="sub" data-es="15 preguntas · 20 segundos por pregunta" data-en="15 questions · 20 seconds each"></p>
    </header>

    <main>
      <!-- Pantalla inicio -->
      <section class="tile" id="pantalla-inicio">
        <h2 data-es="¿Listo para jugar?" data-en="Ready to play?"></h2>
        <p data-es="Se elegirán 15 preguntas al azar de 60, sin repetir en el mismo quiz." data-en="15 questions will be randomly chosen from 60, no repeats in the same quiz."></p>
        <button class="btn-principal" id="btn-comenzar" data-es="Comenzar" data-en="Start"></button>
        <div class="ranking-previo">
          <h3 data-es="Ranking (Top 10)" data-en="Ranking (Top 10)"></h3>
          <ol id="ranking-lista-inicio"></ol>
        </div>
      </section>

      <!-- Pantalla quiz -->
      <section class="tile" id="pantalla-quiz" hidden>
        <div class="quiz-header">
          <div><span data-es="Pregunta" data-en="Question"></span> <span id="preg-num">1</span>/15</div>
          <div class="temporizador"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg> <span id="tiempo">20</span>s</div>
        </div>
        <h2 id="pregunta-texto"></h2>
        <div class="opciones" id="opciones"></div>
      </section>

      <!-- Pantalla resultado -->
      <section class="tile" id="pantalla-resultado" hidden>
        <h2 data-es="Resultado" data-en="Result"></h2>
        <p><span data-es="Correctas" data-en="Correct"></span>: <strong id="res-correctas">0</strong>/15</p>
        <p><span data-es="Puntuación" data-en="Score"></span>: <strong id="res-puntos">0</strong></p>
        <p id="res-mensaje"></p>
        <div class="resultado-acciones">
          <button class="btn-principal" id="btn-repetir" data-es="Jugar de nuevo" data-en="Play again"></button>
          <button class="btn-secundario" id="btn-compartir" data-es="Compartir en WhatsApp" data-en="Share on WhatsApp"></button>
        </div>
        <div class="guardar-puntaje">
          <input id="nombre-jugador" maxlength="3" pattern="[A-Za-z0-9]{3}" placeholder="AAA" autocomplete="off" autocapitalize="characters">
          <button class="btn-principal" id="btn-guardar" data-es="Guardar en ranking" data-en="Save to ranking"></button>
        </div>
        <div class="ranking-final">
          <h3 data-es="Ranking (Top 10)" data-en="Ranking (Top 10)"></h3>
          <ol id="ranking-lista-final"></ol>
        </div>
      </section>
    </main>
  </div>

  <script src="js/preguntas.js"></script>
  <script src="js/quiz.js"></script>
  <script>
    (function () {
      var K = 'jaye-idioma';
      var q = new URLSearchParams(location.search).get('lang');
      var lang = q === 'en' || q === 'es' ? q : null;
      if (!lang) { try { lang = localStorage.getItem(K); } catch (e) {} }
      if (lang !== 'en') lang = 'es';
      function poner(l) {
        lang = l; document.documentElement.lang = l;
        try { localStorage.setItem(K, l); } catch (e) {}
        document.querySelectorAll('[data-es]').forEach(function (n){ n.textContent = n.getAttribute('data-'+l); });
        document.querySelectorAll('[data-lang]').forEach(function (b){ b.setAttribute('aria-pressed', String(b.dataset.lang===l)); });
        var back = document.querySelector('a[href="../index.html"]');
        if (back) back.href = '../index.html' + (l==='en'?'?lang=en':'');
      }
      document.querySelectorAll('[data-lang]').forEach(function (b){ b.addEventListener('click', function(){ poner(b.dataset.lang); location.reload(); }); });
      poner(lang);
    })();
  </script>
</body>
</html>
