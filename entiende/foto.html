<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160f1f">
  <title>Altar digital · Entiende</title>
  <link rel="stylesheet" href="css/entiende.css">
  <link rel="stylesheet" href="css/altar.css">
</head>
<body class="altar-digital">
  <header class="cabecera">
    <div class="fila">
      <h1 data-t="nuestroAltar">Altar digital</h1>
      <div data-idioma></div>
    </div>
    <p data-t="tocaPunto"></p>
  </header>

  <!-- Filtro por categoría: resalta en el altar y en la lista -->
  <nav class="filtros" id="filtros" aria-label="Categorías"></nav>

  <div class="escena-marco">
    <div class="escena" id="escena" tabindex="-1">
      <!-- altar.js dibuja aquí el altar (SVG) -->
    </div>
    <div class="escena-botones">
      <button class="boton secundario chico" id="btn-ampliar" data-t="ampliar"></button>
      <button class="boton chico" id="btn-recorrer" data-t="recorrer"></button>
    </div>
    <p class="aviso-ampliado" id="aviso-ampliado" hidden data-t="deslizaAmpliado"></p>
  </div>

  <div class="globo" id="globo" role="tooltip" hidden></div>

  <details class="lista-altar" id="lista-altar">
    <summary data-t="verLista"></summary>
    <input type="search" id="buscar" class="buscar" autocomplete="off">
    <div id="grupos"></div>
    <p class="sin-resultados" id="sin-resultados" hidden data-t="sinResultados"></p>
  </details>

  <footer class="pie">
    <a class="boton secundario" href="camara.html" data-t="probarCamara"></a>
    <a class="boton secundario" href="index.html" data-t="volver"></a>
  </footer>

  <script src="js/datos.js"></script>
  <script src="js/altar.js"></script>
</body>
</html>
