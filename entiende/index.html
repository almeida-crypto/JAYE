<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160f1f">
  <title>Entiende el altar · Hanal Pixán</title>
  <link rel="stylesheet" href="css/entiende.css">
  <style>
    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
    .arriba { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .eyebrow { color: var(--naranja); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; font-size: .8rem; margin: 0; }
    h1 { font-size: 2.2rem; line-height: 1.1; margin: 0 0 12px; }
    .intro { color: var(--texto-suave); margin: 0 0 28px; }
    .opcion {
      display: block; padding: 20px; margin-bottom: 14px;
      border-radius: var(--radio); border: 1px solid var(--borde);
      background: var(--fondo-2); color: var(--texto); text-decoration: none;
    }
    .opcion strong { display: block; font-size: 1.2rem; margin-bottom: 4px; }
    .opcion span { color: var(--texto-suave); }
    .opcion.principal { border-color: var(--naranja); }
    .volver { display: inline-block; margin-top: 18px; }
  </style>
</head>
<body>
  <div class="papel-picado" aria-hidden="true"></div>
  <main>
    <div class="arriba">
      <p class="eyebrow">Juega · Aprende · Entiende</p>
      <div data-idioma></div>
    </div>
    <h1 data-t="tituloEntiende">Entiende el altar</h1>
    <p class="intro" data-t="introEntiende"></p>

    <a class="opcion principal" href="camara.html">
      <strong data-t="usarCamara"></strong>
      <span data-t="usarCamaraDesc"></span>
    </a>
    <a class="opcion" href="foto.html">
      <strong data-t="verFoto"></strong>
      <span data-t="verFotoDesc"></span>
    </a>

    <a class="volver" href="../index.html" data-t="inicio"></a>
  </main>
  <script src="js/datos.js"></script>
</body>
</html>
