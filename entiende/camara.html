<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Cámara del altar · Entiende</title>
  <link rel="stylesheet" href="css/entiende.css?v=4">
  <link rel="stylesheet" href="css/camara.css">
  <!-- Librerías locales (mismo servidor = una cosa menos que puede fallar en el evento).
       defer conserva el orden: A-Frame → MindAR → nuestro código. -->
  <script defer src="vendor/aframe-1.5.0.min.js"></script>
  <script defer src="vendor/mindar-image-aframe-1.2.5.prod.js"></script>
  <script defer src="js/datos.js?v=2"></script>
  <script defer src="js/camara.js?v=2"></script>
</head>
<body class="camara">
  <!-- Aquí camara.js inserta la escena de A-Frame + MindAR (video de la cámara) -->
  <div id="ar" aria-hidden="true"></div>

  <!-- Capa de etiquetas que siguen a cada tarjeta -->
  <div id="etiquetas"></div>

  <!-- Barra superior -->
  <div class="barra">
    <a href="index.html" class="icono" aria-label="←">←</a>
    <span class="titulo" data-t="tituloEntiende"></span>
    <div data-idioma></div>
    <a href="foto.html" class="enlace-foto" data-t="verFotoCorto">Ver foto</a>
  </div>

  <!-- Indicación mientras busca -->
  <div id="guia" class="guia" hidden>
    <div class="marco" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p id="guia-texto"></p>
  </div>

  <!-- Pantalla de inicio / carga / error -->
  <section id="inicio" class="inicio">
    <div class="franja-bordado" aria-hidden="true"></div>
    <div class="inicio-contenido">
      <p class="eyebrow">Hanal Pixán</p>
      <h1 data-t="camTitulo">Apunta, toca y entiende</h1>
      <ol class="pasos">
        <li data-t="paso1"></li>
        <li data-t="paso2"></li>
        <li data-t="paso3"></li>
      </ol>
      <div id="estado" class="estado" role="status" aria-live="polite"></div>
      <button id="btn-iniciar" class="boton" disabled>Cargando…</button>
      <a class="boton secundario" href="foto.html" data-t="verFoto"></a>
    </div>
  </section>
</body>
</html>
